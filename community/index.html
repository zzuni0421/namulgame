<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🌿 나물게임 커뮤니티 (완전체)</title>
<style>
  body{font-family:Inter,system-ui,AppleSDGothicNeo,Segoe UI,Roboto,'Helvetica Neue',Arial; background:#f0fdf4;margin:0;padding:20px}
  .wrap{max-width:900px;margin:0 auto}
  .card{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,0.06)}
  input,textarea,select{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:8px;box-sizing:border-box}
  button{background:#16a34a;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
  .muted{color:#6b7280;font-size:0.9rem}
  .badge{display:inline-block;padding:2px 6px;border-radius:6px;color:#fff;font-size:0.75rem;margin-left:6px}
  .badge.admin{background:#ef4444} .badge.dev{background:#3b82f6}
  .title{font-weight:700;cursor:pointer}
  .meta{color:#6b7280;font-size:0.9rem;margin-top:6px}
  .controls{display:flex;gap:8px;align-items:center}
  .danger{background:#ef4444}
  .hidden{display:none}
  .blocked{opacity:0.45}
  .comment{background:#f8fafc;border-radius:8px;padding:8px;margin-top:6px}
  .reply{margin-left:12px}
  .small-btn{background:#e2e8f0;color:#111;padding:6px;border-radius:6px;border:none;cursor:pointer}
</style>
<!-- Supabase UMD (브라우저용) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.34.0/dist/supabase.min.js"></script>
</head>
<body>
<div class="wrap">

  <h1>🌿 나물게임 커뮤니티 — 완전체</h1>

  <!-- 유저 영역 -->
  <div class="card" id="userCard">
    <div style="display:flex;gap:12px;align-items:center">
      <div style="flex:1">
        <label class="muted">닉네임 (3~12자)</label>
        <input id="inpNick" placeholder="닉네임 입력">
        <div style="margin-top:8px;display:flex;gap:8px">
          <button id="btnCheck">중복 확인</button>
          <button id="btnSave">저장/입장</button>
        </div>
        <div id="nickStatus" class="muted" style="margin-top:8px"></div>
      </div>
      <div style="min-width:220px">
        <div class="muted">현재 닉네임</div>
        <div id="displayNick" style="font-weight:700;font-size:1.1rem">(미설정)</div>
        <div id="displayRole" class="muted" style="margin-top:6px"></div>
      </div>
    </div>
  </div>

  <!-- 작성 영역 -->
  <div class="card" id="writeCard">
    <label class="muted">제목</label>
    <input id="inpTitle" placeholder="제목">
    <label class="muted" style="margin-top:8px">내용</label>
    <textarea id="inpContent" rows="5" placeholder="내용"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
      <button id="btnPost">글 작성</button>
      <div id="globalBlockedNote" class="muted"></div>
    </div>
  </div>

  <!-- 게시글 리스트 -->
  <div id="postsArea"></div>

</div>

<script>
(async()=>{

const SUPABASE_URL = "uetjeezjqkvpherrpreb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVldGplZXpqcWt2cGhlcnJwcmViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAwNzYyNjAsImV4cCI6MjA3NTY1MjI2MH0.icCYn-V8ekqk9NKadq7Cls_q8IGtKxZHG7NvDAn7r8w";

// supabase client (변수명 충돌 피해서 sb 사용)
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// DOM
const inpNick = document.getElementById('inpNick');
const btnCheck = document.getElementById('btnCheck');
const btnSave = document.getElementById('btnSave');
const nickStatus = document.getElementById('nickStatus');
const displayNick = document.getElementById('displayNick');
const displayRole = document.getElementById('displayRole');

const inpTitle = document.getElementById('inpTitle');
const inpContent = document.getElementById('inpContent');
const btnPost = document.getElementById('btnPost');
const postsArea = document.getElementById('postsArea');
const globalBlockedNote = document.getElementById('globalBlockedNote');

let currentNick = localStorage.getItem('namul_nick') || ''; // 브라우저 저장
let currentRole = 'user'; // user / admin / dev

// helper: 안전한 sleep
const wait = ms => new Promise(r=>setTimeout(r,ms));

// 초기 표시
function refreshUserUI(){
  displayNick.textContent = currentNick || '(미설정)';
  displayRole.textContent = currentRole && currentRole!=='user' ? `역할: ${currentRole}` : '';
  inpNick.value = currentNick;
}

refreshUserUI();

// ---------------- 닉네임 중복체크 ----------------
btnCheck.addEventListener('click', async ()=>{
  const nick = inpNick.value.trim();
  if(!/^[\w가-힣]{3,12}$/.test(nick)) { nickStatus.textContent = '닉네임은 3~12자 영문/한글/숫자/언더바 허용'; nickStatus.style.color='red'; return; }
  const { data, error } = await sb.from('users').select('nickname').eq('nickname', nick).maybeSingle();
  if(error){ nickStatus.textContent = `오류: ${error.message}`; nickStatus.style.color='red'; return; }
  nickStatus.textContent = data ? '이미 사용중 ❌' : '사용 가능 ✅';
  nickStatus.style.color = data ? 'red' : 'green';
});

// ---------------- 닉네임 저장 / 입장 ----------------
btnSave.addEventListener('click', async ()=>{
  const nick = inpNick.value.trim();
  if(!/^[\w가-힣]{3,12}$/.test(nick)) { alert('닉네임 형식 확인'); return; }
  // 사용자 있으면 가져오고, 없으면 insert
  const { data: existing, error: e1 } = await sb.from('users').select('*').eq('nickname', nick).maybeSingle();
  if(e1){ alert('오류: '+e1.message); return; }
  if(!existing){
    const { error: insErr } = await sb.from('users').insert([{ nickname: nick, role: 'user', verified: false }]);
    if(insErr){ alert('저장 실패: '+insErr.message); return; }
  }
  currentNick = nick;
  localStorage.setItem('namul_nick', currentNick);

  // role 가져오기
  const { data: udata } = await sb.from('users').select('role').eq('nickname', currentNick).maybeSingle();
  currentRole = udata?.role || 'user';
  refreshUserUI();
  nickStatus.textContent = '입장 완료';
  nickStatus.style.color = 'green';
  // 새로 로드
  await loadPosts();
});

// ----------------- 차단 체크(글쓰기 금지) -----------------
async function isGloballyBlocked(nick){
  if(!nick) return false;
  const { data } = await sb.from('blocked_users').select('*').eq('blocked', nick).limit(1).maybeSingle();
  return !!data;
}

// 글쓰기 버튼
btnPost.addEventListener('click', async ()=>{
  if(!currentNick) return alert('닉네임을 먼저 설정해 주세요.');
  // 쓰기 금지 여부
  const blocked = await isGloballyBlocked(currentNick);
  if(blocked){ alert('차단된 계정은 글/댓글 작성이 불가능합니다.'); return; }

  const title = inpTitle.value.trim();
  const content = inpContent.value.trim();
  if(!title || !content) return alert('제목과 내용을 입력하세요.');
  const { error } = await sb.from('posts').insert([{ title, content, author: currentNick }]);
  if(error) { alert('게시 실패: '+error.message); return; }
  inpTitle.value=''; inpContent.value='';
  loadPosts();
});

// ----------------- 게시글 로드 -----------------
async function loadPosts(){
  postsArea.innerHTML = '<div class="muted">로딩 중...</div>';
  // 불필요한 동시성 문제 방지 위해 짧게 대기
  await wait(80);

  // 모든 posts 불러오기
  const { data: posts, error } = await sb.from('posts').select('*').order('created_at', { ascending: false });
  if(error){ postsArea.innerHTML = '불러오기 오류: ' + error.message; return; }
  postsArea.innerHTML = '';

  // 캐시: 여러번 users 조회 방지(작게 최적화)
  const authors = [...new Set(posts.map(p=>p.author))].filter(Boolean);
  let rolesMap = {};
  if(authors.length){
    const { data: users } = await sb.from('users').select('nickname, role').in('nickname', authors);
    users?.forEach(u => rolesMap[u.nickname] = u.role);
  }

  // 전역 차단 목록 (global blocked usernames)
  const { data: blockedRows } = await sb.from('blocked_users').select('blocked');
  const blockedSet = new Set((blockedRows||[]).map(r=>r.blocked));

  // render
  for(const post of posts){
    const card = document.createElement('div');
    card.className = 'card';
    // 숨김 if global blocked for viewer? spec: 차단된 사용자는 글/댓글 숨김 — so if post.author is in blockedSet, hide content (but show title maybe with notice)
    const isBlockedGlobally = blockedSet.has(post.author);

    const authorRole = rolesMap[post.author] || 'user';
    const badgeHtml = authorRole === 'admin' ? `<span class="badge admin">관리자</span>` : (authorRole === 'dev' ? `<span class="badge dev">개발자</span>` : '');

    // header: title clickable
    const header = document.createElement('div');
    header.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="title" style="font-size:1.05rem">${escapeHtml(post.title)}</div>
          <div class="meta muted">${escapeHtml(post.author)} ${badgeHtml} · ${new Date(post.created_at).toLocaleString()}</div>
        </div>
        <div class="controls"></div>
      </div>
    `;
    card.appendChild(header);

    // content area (initially hidden)
    const contentArea = document.createElement('div');
    contentArea.className = 'hidden';
    if(isBlockedGlobally){
      contentArea.innerHTML = `<div class="muted">이 사용자는 차단되어 글과 댓글이 숨겨져 있습니다.</div>`;
      card.classList.add('blocked');
    } else {
      contentArea.innerHTML = `
        <div style="margin-top:8px">${escapeHtml(post.content)}</div>
        <div style="margin-top:8px" class="meta">
          <span class="likes">좋아요: <strong id="like-count-${post.id}">${post.likes}</strong></span>
          <button class="small-btn" id="like-btn-${post.id}">좋아요</button>
        </div>
        <div style="margin-top:8px" id="comments-area-${post.id}"></div>
        <div style="margin-top:8px">
          <textarea id="comment-input-${post.id}" rows="2" placeholder="댓글을 입력하세요"></textarea>
          <button class="small-btn" id="comment-send-${post.id}">댓글 등록</button>
        </div>
      `;
    }
    card.appendChild(contentArea);

    // controls: delete, block/unblock (if allowed)
    const controlsDiv = header.querySelector('.controls');
    // delete: if currentNick === post.author OR currentRole admin/dev
    if(currentNick && (currentNick === post.author || ['admin','dev'].includes(currentRole))){
      const delBtn = document.createElement('button'); delBtn.className='small-btn'; delBtn.textContent='삭제';
      delBtn.onclick = async ()=> {
        if(!confirm('정말 삭제하시겠습니까?')) return;
        const { error } = await sb.from('posts').delete().eq('id', post.id);
        if(error) return alert('삭제 실패:'+error.message);
        loadPosts();
      };
      controlsDiv.appendChild(delBtn);
    }
    // block/unblock: only admin/dev can toggle global block
    if(currentNick && ['admin','dev'].includes(currentRole)){
      const blockedNow = blockedSet.has(post.author);
      const blockBtn = document.createElement('button'); blockBtn.className='small-btn';
      blockBtn.textContent = blockedNow ? '차단 해제' : '차단';
      blockBtn.style.background = blockedNow ? '#10b981' : '#ef4444';
      blockBtn.onclick = async ()=>{
        if(blockedNow){
          // unblock (remove all rows where blocked=post.author)
          const { error } = await sb.from('blocked_users').delete().eq('blocked', post.author);
          if(error) return alert('해제 실패:'+error.message);
          alert(post.author+' 차단 해제됨');
        } else {
          const { error } = await sb.from('blocked_users').insert([{ blocker: currentNick, blocked: post.author }]);
          if(error) return alert('차단 실패:'+error.message);
          alert(post.author+' 차단됨');
        }
        loadPosts();
      };
      controlsDiv.appendChild(blockBtn);
    }

    // title click toggles content
    header.querySelector('.title').addEventListener('click', async ()=>{
      contentArea.classList.toggle('hidden');
      if(!contentArea.classList.contains('hidden')){
        // when opening, load comments and wire up like/comment buttons
        if(!isBlockedGlobally){
          setupLikeAndComments(post);
        }
      }
    });

    postsArea.appendChild(card);
  }

  // show/hide global blocked notice on write area
  const blockedSelf = await isGloballyBlocked(currentNick);
  globalBlockedNote.textContent = blockedSelf ? '⚠️ 차단되어 글/댓글 작성이 불가합니다.' : '';

  // ---------------- helper: like & comment wiring ----------------
  async function setupLikeAndComments(post){
    const likeBtn = document.getElementById(`like-btn-${post.id}`);
    const likeCountEl = document.getElementById(`like-count-${post.id}`);
    if(likeBtn){
      likeBtn.onclick = async ()=>{
        if(!currentNick) return alert('닉네임 설정 후 좋아요 가능합니다.');
        // check if already liked
        const { data: exists } = await sb.from('post_likes').select('id').match({ post_id: post.id, nickname: currentNick }).maybeSingle();
        if(exists){ alert('이미 좋아요 했습니다.'); return; }
        const { error: insErr } = await sb.from('post_likes').insert([{ post_id: post.id, nickname: currentNick }]);
        if(insErr) return alert('좋아요 실패:'+insErr.message);
        // increment posts.likes atomically
        const { error: updErr } = await sb.rpc('increment_post_likes', { p_id: post.id }).catch(()=>null);
        // fallback if rpc absent
        if(updErr) {
          await sb.from('posts').update({ likes: post.likes + 1 }).eq('id', post.id);
        }
        // refresh count quickly
        const { data: fresh } = await sb.from('posts').select('likes').eq('id', post.id).maybeSingle();
        if(fresh) likeCountEl.textContent = fresh.likes;
      };
    }

    // comments load & handlers
    await loadCommentsUI(post.id, `comments-area-${post.id}`);
    const commentSendBtn = document.getElementById(`comment-send-${post.id}`);
    if(commentSendBtn){
      commentSendBtn.onclick = async ()=>{
        if(!currentNick) return alert('닉네임 설정 후 댓글 작성 가능');
        const txt = document.getElementById(`comment-input-${post.id}`).value.trim();
        if(!txt) return alert('댓글 내용을 입력하세요');
        const blocked = await isGloballyBlocked(currentNick);
        if(blocked) return alert('차단된 계정은 댓글 작성 불가');
        const { error } = await sb.from('comments').insert([{ post_id: post.id, author: currentNick, content: txt, parent_id: null }]);
        if(error) return alert('댓글 작성 실패:'+error.message);
        document.getElementById(`comment-input-${post.id}`).value = '';
        await loadCommentsUI(post.id, `comments-area-${post.id}`);
      };
    }
  }

  // ---------------- load comments UI (with replies, delete per-rights, reply UI) ----------------
  async function loadCommentsUI(postId, containerId){
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const { data: comments } = await sb.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
    if(!comments) return;
    // build tree by parent_id
    const map = {}; const roots = [];
    comments.forEach(c => { map[c.id] = {...c, replies: []}; });
    comments.forEach(c => {
      if(c.parent_id && map[c.parent_id]) map[c.parent_id].replies.push(map[c.id]);
      else roots.push(map[c.id]);
    });

    function renderCommentNode(node, indent=0){
      // skip if author's globally blocked
      // (we'll check global blocked list once)
      const el = document.createElement('div');
      el.style.marginLeft = indent ? (12*indent + 'px') : '0';
      el.className = 'comment';
      // role badge
      // get role (sync fetch not ideal, but ok)
      let roleText = '';
      // we'll fetch role quickly
      // BUT to reduce calls, we try to get role from users table; small extra call is acceptable
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><strong>${escapeHtml(node.author)}</strong> <span id="role-badge-${node.id}" class="muted"></span></div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="small-btn reply-btn" data-id="${node.id}">답글</button>
            ${ (currentNick===node.author || ['admin','dev'].includes(currentRole)) ? `<button class="small-btn del-comment-btn" data-id="${node.id}">삭제</button>` : '' }
          </div>
        </div>
        <div style="margin-top:6px">${escapeHtml(node.content)}</div>
        <div id="reply-area-${node.id}"></div>
      `;
      container.appendChild(el);

      // load role badge
      (async()=>{
        const { data:u } = await sb.from('users').select('role').eq('nickname', node.author).maybeSingle();
        const badge = u?.role === 'admin' ? '<span class="badge admin">관리자</span>' : (u?.role === 'dev' ? '<span class="badge dev">개발자</span>' : '');
        const target = document.getElementById(`role-badge-${node.id}`);
        if(target) target.innerHTML = badge;
      })();

      // reply button
      el.querySelectorAll('.reply-btn').forEach(btn=>{
        btn.onclick = ()=>{
          const area = document.getElementById(`reply-area-${node.id}`);
          if(area.innerHTML) return area.innerHTML = '';
          area.innerHTML = `<textarea id="reply-input-${node.id}" rows="2" style="width:100%;margin-top:6px"></textarea>
            <div style="margin-top:6px">
              <button class="small-btn" id="reply-send-${node.id}">답글 등록</button>
              <button class="small-btn" id="reply-cancel-${node.id}">취소</button>
            </div>`;
          document.getElementById(`reply-cancel-${node.id}`).onclick = ()=> area.innerHTML = '';
          document.getElementById(`reply-send-${node.id}`).onclick = async ()=>{
            if(!currentNick) return alert('닉네임 설정 필요');
            const txt = document.getElementById(`reply-input-${node.id}`).value.trim();
            if(!txt) return alert('내용 입력');
            const blocked = await isGloballyBlocked(currentNick);
            if(blocked) return alert('차단된 계정은 답글 작성 불가');
            const { error } = await sb.from('comments').insert([{ post_id: postId, author: currentNick, content: txt, parent_id: node.id }]);
            if(error) return alert('답글 실패:'+error.message);
            await loadCommentsUI(postId, containerId);
          };
        };
      });

      // delete comment
      el.querySelectorAll('.del-comment-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm('댓글을 삭제하시겠습니까?')) return;
          const { error } = await sb.from('comments').delete().eq('id', btn.dataset.id);
          if(error) return alert('삭제 실패:'+error.message);
          await loadCommentsUI(postId, containerId);
        };
      });

      // render replies
      if(node.replies && node.replies.length){
        node.replies.forEach(r => renderCommentNode(r, indent+1));
      }
    }

    // global blocked list to skip rendering blocked authors
    const { data: blk } = await sb.from('blocked_users').select('blocked');
    const blockedSet = new Set((blk||[]).map(b=>b.blocked));

    for(const root of roots){
      if(blockedSet.has(root.author)) continue; // skip blocked author's comment tree
      renderCommentNode(root, 0);
    }
  }

  // ----------------- RPC helper: create RPC increment_post_likes if not exists -----------------
  // We'll try to create a simple function if missing; ignore errors if cannot create
  try {
    await sb.rpc('dummy_check').catch(()=>{}); // no-op to satisfy some hosts
  } catch(e){
    /* ignore */
  }

  // -------------- small helpers --------------
  function escapeHtml(str){
    if(!str) return '';
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

} )();
</script>
</body>
</html>
