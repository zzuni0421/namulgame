<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나물게임 커뮤니티</title>

<!-- Tailwind -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">

<style>
body { background:#f0fdf4; font-family:'Pretendard',sans-serif; }
.container { max-width:800px; margin:2rem auto; }
.post, .comment { background:white; border-radius:.5rem; padding:1rem; margin-bottom:1rem; }
.badge { display:inline-block; background:#22c55e; color:white; font-size:.75rem; padding:.1rem .4rem; border-radius:.25rem; margin-left:.5rem; }
.anonymous { color:#94a3b8; font-style:italic; }
.like-btn { cursor:pointer; color:#22c55e; font-weight:bold; margin-left:1rem; }
input, textarea { border:1px solid #d1d5db; padding:.5rem; border-radius:.375rem; width:100%; margin-top:.5rem; }
button { background:#22c55e; color:white; padding:.5rem 1rem; border-radius:.375rem; margin-top:.5rem; }
</style>
</head>
<body>

<div class="container">
  <h1 class="text-2xl font-bold mb-4">🌿 나물게임 커뮤니티</h1>

  <!-- 글 작성 -->
  <div class="post mb-6">
    <input type="text" id="postTitle" placeholder="글 제목">
    <textarea id="postContent" placeholder="내용"></textarea>
    <label><input type="checkbox" id="postAnonymous"> 익명으로 작성</label>
    <button id="btnPost">글 작성</button>
  </div>

  <!-- 글 목록 -->
  <div id="postsContainer"></div>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.34.0/dist/umd/supabase.min.js"></script>
<script>
window.addEventListener("load", async () => { // load 이벤트로 변경
  // Supabase 로드 확인
  if (!window.supabase) {
    alert("서버(Supabase) 로드 실패! 인터넷 연결을 확인하세요.");
    return;
  }

  // Supabase 초기화
  const SUPABASE_URL = "https://uetjeezjqkvpherrpreb.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";
  const { createClient } = window.supabase;
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = { email: "익명", role: "guest" };

  async function loadPosts() {
    const { data: posts, error } = await supabase
      .from("posts")
      .select("*")
      .order("created_at", { ascending: false });
    if (error) return console.error(error);

    const container = document.getElementById("postsContainer");
    container.innerHTML = "";

    posts.forEach(post => {
      const postEl = document.createElement("div");
      postEl.className = "post";

      const authorName = post.anonymous ? "익명" : post.author;
      const badge = post.role !== "guest" ? `<span class="badge">${post.role}</span>` : "";

      postEl.innerHTML = `
        <h3 class="font-bold">${post.title} ${badge}</h3>
        <p>${post.content}</p>
        <div class="text-sm text-gray-500">
          작성자: <span class="${post.anonymous ? 'anonymous' : ''}">${authorName}</span> |
          좋아요: <span id="like-${post.id}">${post.likes ?? 0}</span>
          <span class="like-btn" onclick="likePost('${post.id}')">💚</span>
        </div>
        <div id="comments-${post.id}" class="ml-4 mt-2"></div>
        <textarea id="commentInput-${post.id}" placeholder="댓글 작성"></textarea>
        <button onclick="addComment('${post.id}')">댓글 달기</button>
      `;
      container.appendChild(postEl);
      loadComments(post.id);
    });
  }

  async function loadComments(postId) {
    const { data: comments } = await supabase
      .from("comments")
      .select("*")
      .eq("post_id", postId)
      .order("created_at", { ascending: true });

    const container = document.getElementById(`comments-${postId}`);
    container.innerHTML = "";

    comments.forEach(c => {
      const authorName = c.anonymous ? "익명" : c.author;
      const badge = c.role !== "guest" ? `<span class="badge">${c.role}</span>` : "";
      const div = document.createElement("div");
      div.className = "comment";
      div.innerHTML = `<strong>${authorName} ${badge}</strong>: ${c.content}`;
      container.appendChild(div);
    });
  }

  document.getElementById("btnPost").addEventListener("click", async () => {
    const title = document.getElementById("postTitle").value.trim();
    const content = document.getElementById("postContent").value.trim();
    const anonymous = document.getElementById("postAnonymous").checked;

    if (!title || !content) return alert("제목과 내용을 입력하세요.");

    await supabase.from("posts").insert([{
      title, content,
      author: currentUser.email,
      role: currentUser.role,
      anonymous
    }]);

    document.getElementById("postTitle").value = "";
    document.getElementById("postContent").value = "";
    document.getElementById("postAnonymous").checked = false;

    loadPosts();
  });

  window.addComment = async function (postId) {
    const input = document.getElementById(`commentInput-${postId}`);
    const content = input.value.trim();
    if (!content) return alert("댓글 내용을 입력하세요.");

    await supabase.from("comments").insert([{
      post_id: postId,
      content,
      author: currentUser.email,
      role: currentUser.role,
      anonymous: false
    }]);

    input.value = "";
    loadComments(postId);
  }

  window.likePost = async function (postId) {
    await supabase.rpc('increment_likes', { p_id: postId });
    loadPosts();
  }

  loadPosts();
});
</script>
</body>
</html>
