<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나물게임 로비</title>
<link rel="stylesheet" href="assets/style/lobbystyle.css">
</head>
<body>
<div class="container">
  <div class="event-banner">
    🌱 이 게임에서 이벤트 진행 중! 참여하러 가기 🌱
  </div>

  <div class="auth-buttons">
    <button id="btnOpenLogin" class="btn">로그인</button>
    <button id="btnOpenRegister" class="btn">회원가입</button>
  </div>

  <div id="userInfo" class="user-info"></div>
  <button id="btnLogout" class="btn">로그아웃</button>
  <button id="btnSecret" class="btn secret-btn">하드모드</button>

  <div class="genre-buttons">
    <button id="btnSimulation" class="btn genre-btn">Simulation</button>
    <button id="btnTest" class="btn genre-btn">Test</button>
    <button id="btnGame" class="btn genre-btn">Game</button>
  </div>
</div>
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeLogin">&times;</span>
    <h2>로그인</h2>
    <input type="text" id="loginUsername" placeholder="아이디">
    <input type="password" id="loginPassword" placeholder="비밀번호">
    <button id="btnLogin" class="btn">로그인</button>
  </div>
</div>

<div id="registerModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeRegister">&times;</span>
    <h2>회원가입</h2>
    <input type="text" id="registerUsername" placeholder="아이디 (영문+숫자 3~15자)" oninput="validateUserId()">
    <button type="button" onclick="checkDuplicate()">중복 확인</button>
    <div id="idFeedback" style="font-size: 0.9rem; margin-top: 4px;"></div>
    <input type="password" id="registerPassword" placeholder="비밀번호">
    <button id="btnRegister" class="btn">회원가입</button>
  </div>
</div>

<div id="gameModal" class="modal">
  <div class="modal-content">
    <span class="close" id="btnCloseGameModal">&times;</span>
    <div id="gameList" class="game-list"></div>
  </div>
  
<button onclick="togglePopup('lobbyPopup')">추가 메뉴 열기</button>
 <div id="lobbyPopup" class="popup">
   <div class="popup-content">
     <span class="close" onclick="togglePopup('lobbyPopup')">&times;</span>
     <h2>🌱 나물게임 메뉴</h2>
     <div class="popup-buttons">
       <button onclick="window.open('https://youtube.com/@namulgame','_blank')">▶️ 나물게임 유튜브</button>
       <button onclick="window.open('https://youtube.com/@namuli','_blank')">🌱 나물이 유튜브</button>
       <button onclick="location.href='mailto:zzuni0421@gmail.com'">📧 Gmail 보내기</button>
       <button onclick="location.href='mailto:zzuni0421@naver.com'">📨 Naver 메일 보내기</button>
       <button onclick="location.href='license.html'">📜 라이선스</button>
       <button onclick="window.open('https://forms.gle/bEL2EeMexCVw4MXWA','_blank')">📝 설문조사</button>
     </div>
   </div>
 </div>
  
<script src="game/js/lobby.js"></script>
</body>
</html>
