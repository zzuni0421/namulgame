<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Namul Lobby</title>
  <link rel="stylesheet" href="assets/style/lobbystyle.css">
</head>
<body>
  <!-- 상단 배너 -->
  <header>
    <h1>나물 키우기 외 3개</h1>
    <button id="secretBtn">시크릿</button>
  </header>

  <!-- 탭 메뉴 -->
  <nav>
    <button class="tabBtn" data-tab="simulation">시뮬레이션</button>
    <button class="tabBtn" data-tab="game">게임</button>
    <button class="tabBtn" data-tab="test">테스트</button>
  </nav>

  <!-- 컨텐츠 영역 -->
  <main>
    <section id="simulation" class="tabContent active">
      <h2>시뮬레이션</h2>
      <p>여기에 시뮬레이션 관련 내용 표시</p>
    </section>
    <section id="game" class="tabContent">
      <h2>게임</h2>
      <p>여기에 게임 관련 내용 표시</p>
    </section>
    <section id="test" class="tabContent">
      <h2>테스트</h2>
      <p>여기에 테스트 관련 내용 표시</p>
    </section>
  </main>

  <!-- 로그인 & 회원가입 -->
  <aside>
    <h3>로그인</h3>
    <input id="loginUsername" placeholder="아이디">
    <input id="loginPassword" type="password" placeholder="비밀번호">
    <button id="loginBtn">로그인</button>

    <h3>회원가입</h3>
    <input id="regUsername" placeholder="아이디">
    <input id="regPassword" type="password" placeholder="비밀번호">
    <button id="registerBtn">회원가입</button>
  </aside>

  <script src="game/js/lobby.js"></script>
</body>
</html>
