<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나물게임 로비</title>
  <link rel="stylesheet" href="assets/style/lobbystyle.css">
</head>
<body>
  <div class="top-bar">
    <div class="top-left">
      <span id="loginStatus">비로그인 상태</span>
    </div>
    <div class="top-right">
      <button id="btnOpenLogin" class="btn sm">로그인</button>
      <button id="btnLogout" class="btn sm" style="display:none;">로그아웃</button>
      <button id="btnSecret" class="btn sm" style="display:none;">시크릿 코드</button>
    </div>
  </div>

  <div class="lobby-container">
    <h1>나물게임</h1>
    <p class="sub">장르를 골라서 게임을 시작하세요!</p>
    <div class="genre-buttons">
      <button class="btn" onclick="openModal('simulation')">🧪 시뮬레이션</button>
      <button class="btn" onclick="openModal('test')">🧠 테스트</button>
      <button class="btn" onclick="openModal('game')">🎮 게임</button>
    </div>
  </div>

  <!-- 모달 공통 구조 -->
  <div class="modal" id="genreModal" aria-hidden="true" inert>
    <div class="modal-content">
      <h2 id="modalTitle">게임 목록</h2>
      <div id="gameList" class="game-list"></div>
      <button id="btnCloseGenre" class="btn outline">닫기</button>
    </div>
  </div>

  <div class="modal" id="authModal" aria-hidden="true" inert>
    <div class="modal-content narrow">
      <h2>로그인</h2>
      <input type="text" id="loginUsername" placeholder="닉네임">
      <input type="password" id="loginPassword" placeholder="비밀번호">
      <button id="btnLogin" class="btn primary">로그인</button>
      <p class="muted">아직 회원이 아니신가요? <a href="#" id="linkRegister">회원가입</a></p>
      <button id="btnCloseAuth" class="btn outline">닫기</button>
    </div>
  </div>

  <div class="modal" id="registerModal" aria-hidden="true" inert>
    <div class="modal-content narrow">
      <h2>회원가입</h2>
      <input type="text" id="registerUsername" placeholder="닉네임">
      <input type="password" id="registerPassword" placeholder="비밀번호">
      <label class="agree">
        <input type="checkbox" id="agreeLicense"> 라이선스 동의
      </label>
      <button id="btnRegister" class="btn primary">회원가입</button>
      <button id="btnCloseRegister" class="btn outline">닫기</button>
    </div>
  </div>

  <div class="modal" id="secretModal" aria-hidden="true" inert>
    <div class="modal-content narrow">
      <h2>시크릿 코드</h2>
      <input type="password" id="secretCodeInput" placeholder="코드 입력">
      <button id="btnCheckSecret" class="btn primary">확인</button>
      <button id="btnCloseSecret" class="btn outline">닫기</button>
    </div>
  </div>

  <script src="game/js/lobby.js"></script>
</body>
</html>
