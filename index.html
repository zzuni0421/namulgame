<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌱 나물게임 점검중</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #eafff1, #f5fff9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2937;
    }

    .wrap {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 90%;
    }

    .emoji {
      font-size: 64px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 20px;
    }

    .status {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #dcfce7;
      color: #15803d;
      font-size: 14px;
      font-weight: 600;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">🌱</div>
    <h1>나물게임 점검중</h1>
    <p>
      서버 오류로 인한 점검 중이에요..<br>
      7월 10일에 다시 방문해 주세요!
    </p>
    <div class="status">🔧점검중 😯</div>
    <footer>
      © 2026 namulgame
    </footer>
  </div>
</body>
</html>
