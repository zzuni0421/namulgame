<body>
<div class="container">
  <div class="auth-buttons">
    <button id="btnOpenLogin" class="btn">로그인</button>
    <button id="btnOpenRegister" class="btn">회원가입</button>
  </div>

  <div id="userInfo" class="user-info"></div>
  <button id="btnLogout" class="btn">로그아웃</button>

  <div class="genre-buttons">
    <button id="btnSimulation" class="btn genre-btn">시뮬레이션</button>
    <button id="btnTest" class="btn genre-btn">테스트</button>
    <button id="btnGame" class="btn genre-btn">게임</button>
  </div>
</div>

<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeLogin">&times;</span>
    <h2>로그인</h2>
    <input type="text" id="loginUsername" placeholder="아이디">
    <input type="password" id="loginPassword" placeholder="비밀번호">
    <button id="btnLogin" class="btn">로그인</button>
  </div>
</div>

<div id="registerModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeRegister">&times;</span>
    <h2>회원가입</h2>
    <input type="text" id="registerUsername" placeholder="아이디 (영문+숫자 3~15자)" oninput="validateUserId()">
    <button type="button" onclick="checkDuplicate(registerUsername.value)">중복 확인</button>
    <div id="idFeedback" style="font-size: 0.9rem; margin-top: 4px;"></div>
    <input type="password" id="registerPassword" placeholder="비밀번호">
    <button id="btnRegister" class="btn">회원가입</button>
  </div>
</div>

<!-- GAME LIST MODAL -->
<div id="gameModal" class="modal">
  <div class="modal-content">
    <span class="close" id="btnCloseGameModal">&times;</span>
    <div id="gameList" class="game-list"></div>
  </div>
</div>

<!-- EXTRA MENU BUTTON (항상 로비에 보이도록 모달 밖에 둠) -->
<button id="extraMenuBtn" class="btn">📌 추가 메뉴</button>

<!-- EXTRA MENU MODAL -->
<div id="extraMenuModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeExtraMenu">&times;</span>
    <h2>📋 추가 메뉴</h2>
    <div class="popup-buttons">
      <button onclick="window.open('https://mobile-namulgame.pages.dev','_blank')">모바일 버전 나물게임(준비중)</button>
      <button onclick="location.href='board/qna.html'">❓QnA</button>
      <button onclick="location.href='license.html'">📜 라이선스 보기</button>
      <button onclick="window.open('https://www.youtube.com/@나물게임','_blank')">▶️ 나물게임 유튜브</button>
      <button onclick="window.open('https://www.youtube.com/@나물게임나물이','_blank')">▶️ 나물이 유튜브</button>
      <button onclick="location.href='mailto:zzuni0421@naver.com'">📧 네이버 메일</button>
      <button onclick="location.href='mailto:zzuni0421@gmail.com'">📧 구글 메일</button>
      <button onclick="window.open('https://forms.gle/bEL2EeMexCVw4MXWA','_blank')">📝 설문조사</button>
    </div>
  </div>
</div>

<script src="game/js/lobby.js"></script>
</body>
</html>
