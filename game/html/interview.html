<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 나물이 인터뷰 시뮬레이터 🎤</title>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard", sans-serif;
      background: linear-gradient(180deg, #ffffff, #f0fdf4);
      color: #222;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .interview-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      margin-top: 20px;
    }

    .namuli-img {
      width: 160px;
      height: auto;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .interview-box {
      background: #ffffffcc;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      flex: 1;
      max-width: 500px;
    }

    #question {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    #answer {
      padding: 10px;
      width: 80%;
      border-radius: 10px;
      border: 2px solid #a7f3d0;
      margin-bottom: 10px;
    }

    button {
      background: #34d399;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    button:hover {
      background: #059669;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* 개그콘서트급 연출 */
    .punchline {
      font-size: 1.3rem;
      color: #ef4444;
      margin-top: 15px;
      animation: shake 0.4s infinite alternate;
    }

    @keyframes shake {
      from { transform: rotate(-2deg); }
      to { transform: rotate(2deg); }
    }
  </style>
</head>
<body>
  <h1>🌱 나물이 인터뷰 시뮬레이터 🎤</h1>
  <p>면접관: "귀여운 척만 하면 다 좋아하잖아~" 😂</p>

  <div class="interview-container">
    <img src="assets/나물이.png" alt="나물이 면접관" class="namuli-img">
    <div class="interview-box">
      <p id="question">첫 질문: 당신은 왜 나물게임에 지원했나요?</p>
      <input type="text" id="answer" placeholder="답변 입력하기...">
      <br>
      <button onclick="nextQuestion()">다음 질문</button>
      <div id="result"></div>
    </div>
  </div>

  <script>
    const questions = [
      "나물이와 함께 일하고 싶은 이유는?",
      "귀여움이란 무엇이라 생각하나요?",
      "개그콘서트 시절 최애 코너는?",
      "마지막으로 하고 싶은 말은?"
    ];
    let current = 0;

    function nextQuestion() {
      const ans = document.getElementById("answer").value.trim();
      const result = document.getElementById("result");

      if (ans === "") {
        result.innerHTML = "👉 대답을 입력해 주세요!";
        return;
      }

      // 개그 타이밍으로 랜덤 멘트
      const punchlines = [
        "ㅋㅋㅋㅋ 이건 합격 각",
        "아니 이 대답 뭐냐고 🤣",
        "면접관 나물이: '귀여워~!'",
        "👏👏👏 기립박수 나왔다"
      ];
      result.innerHTML = `<div class="punchline">${punchlines[Math.floor(Math.random()*punchlines.length)]}</div>`;

      current++;
      if (current < questions.length) {
        document.getElementById("question").textContent = questions[current];
        document.getElementById("answer").value = "";
      } else {
        document.getElementById("question").textContent = "면접 종료! 수고하셨습니다. 🌱";
        document.getElementById("answer").style.display = "none";
      }
    }
  </script>
</body>
</html>
