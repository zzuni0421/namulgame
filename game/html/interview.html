<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>면접 시뮬레이터: 나를 뽑아줘!</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="game">
    <h1>💼 면접 시뮬레이터: 나를 뽑아줘!</h1>
    <div id="ui">
      <div id="interviewer">
        <img id="face" src="assets/img/neutral.png" alt="면접관">
      </div>
      <div id="chat"></div>
      <div id="stats">
        <div>호감도 ❤️ <progress id="like" max="100" value="50"></progress></div>
        <div>스트레스 😡 <progress id="stress" max="100" value="0"></progress></div>
      </div>
    </div>
    <div id="input">
      <input type="text" id="answer" placeholder="답변을 입력하세요...">
      <button onclick="submitAnswer()">제출</button>
    </div>
  </div>
  <script src="assets/script.js"></script>
</body>
</html>
