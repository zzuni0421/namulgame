<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>점프 게임 (v2)</title>
<style>
:root{
--bg: #f8fbff;
--card: #ffffff;
--accent: #27a3ff;
--muted: #6b7280;
--good: #10b981;
--danger: #ef4444;
--glass: rgba(255,255,255,0.6);
font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
}
html,body{height:100%;margin:0;background:linear-gradient(180deg,#f0fbff 0%, #ffffff 100%);color:#0f172a}
.wrap{display:flex;flex-direction:column;height:100vh;gap:8px;padding:10px;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(45deg,var(--accent),#7dd3fc);display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
h1{font-size:16px;margin:0}
.controls{display:flex;gap:8px;align-items:center}
button{background:var(--card);border:1px solid rgba(15,23,42,0.06);padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer}
button.primary{background:var(--accent);color:white;border:0}
.hud{display:flex;gap:12px;align-items:center}
.hud .chip{background:var(--glass);padding:8px 10px;border-radius:10px;backdrop-filter:blur(6px);font-weight:600}

.game-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
#gameCanvas{border-radius:14px;box-shadow:0 8px 30px rgba(15,23,42,0.08);background:linear-gradient(180deg,#dff6ff 0%, #ffffff 60%);touch-action:none}

.overlay{position:absolute;left:50%;transform:translateX(-50%);top:110px;background:var(--card);padding:10px;border-radius:10px;box-shadow:0 10px 30px rgba(2,6,23,0.08);display:flex;gap:10px;align-items:center}

footer{display:flex;justify-content:space-between;align-items:center;padding:6px 10px}
.note{color:var(--muted);font-size:13px}

.ending-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;z-index:10}
.ending-screen h2{font-size:22px;margin:0}
.ending-screen p{font-size:16px;color:#374151}
.ending-screen button{padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.ending-screen button.primary{background:var(--accent);color:#fff;border:0}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand">
<div class="logo">나물</div>
<div>
<h1>(9.7 리뉴얼) 점프게임</h1>
<div style="font-size:12px;color:var(--muted)">모바일 최적화 · 보스 시스템 탑재</div>
</div>
</div>

<div class="controls">
<div class="hud">
<div class="chip" id="scoreChip">점수: 0</div>
<div class="chip" id="timeChip">시간: 0s</div>
<div class="chip" id="hpChip" style="display:none">몬스터HP: 0</div>
</div>
<button id="restartBtn" class="primary">다시하기</button>
<button id="lobbyBtn">로비로</button>
</div>
</header>

<div class="game-area">
<canvas id="gameCanvas"></canvas>
<div id="msg" class="overlay" style="display:none">게임 오버!</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreChip = document.getElementById('scoreChip');
  const timeChip = document.getElementById('timeChip');
  const hpChip = document.getElementById('hpChip');
  const restartBtn = document.getElementById('restartBtn');
  const lobbyBtn = document.getElementById('lobbyBtn');
  const msg = document.getElementById('msg');

  function resizeCanvas(){
    const headerHeight = document.querySelector('header').getBoundingClientRect().height;
    const availableH = window.innerHeight - headerHeight - 30;
    const availableW = window.innerWidth - 20;
    canvas.width = Math.max(320, availableW);
    canvas.height = Math.max(240, availableH);
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';
  }
  window.addEventListener('resize', resizeCanvas);

  let running = false;
  let score = 0;
  let startTime = 0;
  let lastResetTime = 0;
  let elapsed = 0;
  let lastFrame = 0;

  const player = {
    x: 80,
    y: 0,
    w: 44,
    h: 44,
    vy: 0,
    gravity: 1800,
    jumpVel: -720,
    grounded: false
  };

  function resetPlayer(){
    player.x = Math.round(canvas.width * 0.12);
    player.y = canvas.height - player.h - 16;
    player.vy = 0;
    player.grounded = true;
  }

  const floor = { yOffset: 16 };

  const obstacles = [];
  let obstacleTimer = 0;
  let obstacleInterval = 1200;

  const items = [];
  let itemTimer = 0;
  const itemInterval = 1400;

  const monsters = [];

  function spawnMonster(hp){
    const m = {
      x: canvas.width + 80,
      y: canvas.height - 120,
      w: 80,
      h: 80,
      hp: hp,
      maxHp: hp,
      vx: -80
    };
    monsters.push(m);
    hpChip.style.display = '';
    hpChip.textContent = `몬스터HP: ${m.hp}`;
  }

  function spawnItem(){
    const it = {
      x: canvas.width + Math.random()*200,
      y: canvas.height - 200 - Math.random()*120,
      r: 12,
      vx: -220
    };
    items.push(it);
  }

  function spawnObstacle(){
    const height = 20 + Math.random()*60;
    const ob = {
      x: canvas.width + Math.random()*120,
      y: canvas.height - height - floor.yOffset,
      w: 18 + Math.random()*26,
      h: height,
      vx: - (220 + Math.random()*140)
    };
    obstacles.push(ob);
  }

  function computeThresholds(){
    return [100,200,300,500,600,700,800,1000];
  }

  let thresholds = computeThresholds();
  let nextThresholdIndex = 0;

  function checkSpecials(){
    elapsed = Math.floor((performance.now() - lastResetTime) / 1000);
    timeChip.textContent = `시간: ${elapsed}s`;

    if(nextThresholdIndex < thresholds.length && elapsed >= thresholds[nextThresholdIndex] && monsters.length === 0){
      const off = thresholds[nextThresholdIndex];
      if(off === 100 || off === 200 || off === 300){
        spawnMonster(100);
      } else if(off >=500 && off < 1000){
        spawnMonster(500);
      } else if(off === 1000){
        spawnMonster(1000);
      }
      nextThresholdIndex++;
    }

    if(elapsed > 1000 && monsters.length === 0 && nextThresholdIndex >= thresholds.length){
      spawnMonster(500);
      nextThresholdIndex++;
    }
  }

  function rectColl(a,b){
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function circleRectColl(c, r){
    const cx = c.x;
    const cy = c.y;
    const rx = r.x;
    const ry = r.y;
    const rw = r.w;
    const rh = r.h;
    const closestX = Math.max(rx, Math.min(cx, rx+rw));
    const closestY = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx*dx + dy*dy) < (c.r * c.r);
  }

  function doJump(){
    if(!running) return;
    if(player.grounded){
      player.vy = player.jumpVel;
      player.grounded = false;
    }
  }
  canvas.addEventListener('pointerdown', () => doJump());
  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space'){
      e.preventDefault();
      doJump();
    }
  });

  restartBtn.addEventListener('click', () => startGame());
  lobbyBtn.addEventListener('click', () => {
    if(confirm('로비로 돌아가시겠어요?')){
      window.location.href = '/';
    }
  });

  function startGame(){
    resizeCanvas();
    obstacles.length = 0; items.length = 0; monsters.length = 0;
    score = 0; scoreChip.textContent = `점수: ${score}`;
    lastResetTime = performance.now();
    startTime = lastResetTime;
    nextThresholdIndex = 0;
    thresholds = computeThresholds();
    obstacleTimer = 0; itemTimer = 0;
    obstacleInterval = 900;
    running = true;
    msg.style.display = 'none';
    hpChip.style.display = 'none';
    const oldEnding = document.querySelector('.ending-screen');
    if(oldEnding) oldEnding.remove();
    resetPlayer();
    lastFrame = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver(){
    running = false;
    msg.style.display = '';
    msg.textContent = '게임 오버! 다시하기를 눌러라.';
  }

  function triggerEnding(){
    running = false;
    const endDiv = document.createElement("div");
    endDiv.className = "ending-screen";
    endDiv.innerHTML = `
      <h2>🎉 축하합니다! 최종 보스를 쓰러뜨렸습니다! 🎉</h2>
      <p>플레이 시간: ${elapsed}s<br/>점수: ${score}</p>
      <button class="primary" onclick="location.reload()">다시하기</button>
      <button onclick="location.href='/'">로비로 돌아가기</button>
    `;
    document.querySelector(".game-area").appendChild(endDiv);
  }

  function loop(t){
    if(!running) return;
    const dt = Math.min(40, t - lastFrame) / 1000;
    lastFrame = t;

    player.vy += player.gravity * dt;
    player.y += player.vy * dt;
    const groundY = canvas.height - player.h - floor.yOffset;
    if(player.y >= groundY){
      player.y = groundY;
      player.vy = 0;
      player.grounded = true;
    }

    obstacleTimer += dt*1000;
    if(obstacleTimer > obstacleInterval){
      obstacleTimer = 0;
      obstacleInterval = 700 + Math.random()*900 - Math.min(500, Math.floor((performance.now()-startTime)/10000)*30);
      spawnObstacle();
    }

    for(let i = obstacles.length-1; i>=0; i--){
      const o = obstacles[i];
      o.x += o.vx * dt;
      if(o.x + o.w < -50) obstacles.splice(i,1);
      if(rectColl(player,o)){
        gameOver();
        return;
      }
    }

    checkSpecials();

    for(let i = monsters.length-1; i>=0; i--){
      const m = monsters[i];
      m.x += m.vx * dt;
      if(m.x < canvas.width*0.6) m.vx = 0;

      const monRect = {x:m.x,y:m.y,w:m.w,h:m.h};
      if(rectColl(player, monRect)){
        gameOver();
        return;
      }

      hpChip.textContent = `몬스터HP: ${m.hp}`;
    }

    if(monsters.length > 0){
      itemTimer += dt*1000;
      if(itemTimer > itemInterval){
        itemTimer = 0;
        spawnItem();
      }
    }

    for(let i = items.length-1; i>=0; i--){
      const it = items[i];
      it.x += it.vx * dt;
      const circ = {x: it.x, y: it.y, r: it.r};
      if(circleRectColl(circ, player)){
        if(monsters.length>0){
          monsters[0].hp -= 10;
          score += 7;
          scoreChip.textContent = `점수: ${score}`;
          if(monsters[0].hp <= 0){
            if(monsters[0].maxHp === 1000){
              triggerEnding();
              return;
            }
            monsters.splice(0,1);
            hpChip.style.display = 'none';
            lastResetTime = performance.now();
            nextThresholdIndex = 0;
            thresholds = computeThresholds();
          }
        }
        items.splice(i,1);
        continue;
      }
      if(it.x + it.r < -50) items.splice(i,1);
    }

    score += Math.floor(dt * 2);
    scoreChip.textContent = `점수: ${score}`;

    render();

    requestAnimationFrame(loop);
  }

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = '#e6f5ff';
    ctx.fillRect(0, canvas.height-120, canvas.width, 120);

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(Math.round(player.x), Math.round(player.y), player.w, player.h);

    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x+8, player.y+12, 8,8);
    ctx.fillRect(player.x+28, player.y+12, 8,8);

    ctx.fillStyle = '#064e3b';
    obstacles.forEach(o => {
      ctx.fillRect(Math.round(o.x), Math.round(o.y), Math.round(o.w), Math.round(o.h));
    });

    ctx.fillStyle = '#f59e0b';
    items.forEach(it => {
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI*2); ctx.fill();
    });

    monsters.forEach(m => {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(Math.round(m.x), Math.round(m.y), m.w, m.h);
      ctx.fillStyle = '#111827';
      const barW = 80; const barH = 8;
      const bx = Math.round(m.x + (m.w - barW)/2);
      const by = Math.round(m.y - 14);
      ctx.fillRect(bx, by, barW, barH);
      ctx.fillStyle = '#10b981';
      const pct = Math.max(0, m.hp) / m.maxHp;
      ctx.fillRect(bx, by, Math.round(barW*pct), barH);
    });
  }

  resizeCanvas();
  resetPlayer();
  startGame();

})();
</script>
</body>
</html>
