<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나물 줍기 게임</title>
<link rel="stylesheet" href="../../assets/style/style.css">
</head>
<body>
<div id="eventBanner">
  🌱 이 게임에서 이벤트 진행 중! 
  <a href="../../event" target="_blank">참여하러 가기</a> 🌱
</div>

<div id="timeSelect">
  <button class="timeBtn" data-time="10">10초</button>
  <button class="timeBtn" data-time="20">20초</button>
  <button class="timeBtn" data-time="30">30초</button>
  <button class="timeBtn" data-time="60">1분</button>
</div>

<div id="controls">
    <button id="hardModeBtn">하드모드 시작</button>
</div>

<div id="gameContainer">
    <div id="score">점수: 0</div>
    <div id="gameBoard"></div>
</div>

<script type="module" src="../js/gameAuth.js"></script>
<script type="module" src="../js/game.js"></script>
</body>
</html>
