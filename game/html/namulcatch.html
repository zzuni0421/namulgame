<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나물 줍기 게임</title>
  <link rel="stylesheet" href="../../assets/style/style.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>🌱 나물 줍기 게임 🌱</h1>
      <div class="user-info">
        <span id="userDisplay"></span>
      </div>
    </header>

    <main>
      <div class="menu">
        <h2>게임 모드 선택</h2>
        <button class="mode-btn" data-mode="10">10초</button>
        <button class="mode-btn" data-mode="20">20초</button>
        <button class="mode-btn" data-mode="30">30초</button>
        <button class="mode-btn" data-mode="60">1분</button>
        <button class="mode-btn" data-mode="infinite">무한</button>
        <button class="mode-btn hard" data-mode="hard">하드모드</button>
      </div>

      <div class="game" id="gameArea">
        <p class="info">게임 모드를 선택하면 시작합니다.</p>
      </div>
    </main>

    <footer>
      <p>© 2025 나물게임</p>
    </footer>
  </div>

  <script src="../js/game.js"></script>
</body>
</html>
