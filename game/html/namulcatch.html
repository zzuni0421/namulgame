<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>나물 줍기 게임</title>
  <link rel="stylesheet" href="../../assets/style/style.css"/>
</head>
<body>
  <!-- 이벤트 배너 -->
  <div id="namul-event-banner">
    <span id="banner-text-before">🌱 이 게임에서 이벤트 진행 중! </span>
    <a id="banner-link" href="../../event">참여하러 가기</a>
    <span id="banner-text-after"> 🌱</span>
  </div>

  <div id="main-menu">
    <h1>🌱 나물 줍기</h1>

    <div class="row">
      <select id="lang-select">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
      </select>
    </div>

    <h2>시간 선택</h2>
    <div class="row">
      <button class="time-btn" data-time="30">30s</button>
      <button class="time-btn" data-time="60">60s</button>
      <button class="time-btn" data-time="90">90s</button>
      <button class="time-btn" data-time="infinite">∞ 무한</button>
    </div>

    <button id="back-index-btn">메인으로</button>
  </div>

  <!-- 게임 화면 -->
  <div id="game-container" style="display:none;">
    <div class="scoreboard">
      <span id="score-label">점수:</span> <span id="score">0</span>
      <span id="time-box"> | 시간: <span id="time">0</span>s</span>
    </div>

    <div id="game-area"></div>

    <p id="game-over-msg" style="display:none;">게임 종료!</p>

    <div class="row">
      <button id="restart-btn">다시 시작</button>
      <button id="back-btn">처음부터</button>
    </div>
  </div>

  <script src="../../lang/lang.js"></script>
  <script src="../js/game.js"></script>
  <button id="hardBtn" style="display:none;">하드모드</button>
</body>
</html>
