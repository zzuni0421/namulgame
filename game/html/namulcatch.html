<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나물 줍기 게임</title>
  <link rel="stylesheet" href="../../assets/style/style.css">
</head>
<body>
  <div class="container">
    <h1>나물 줍기 게임</h1>
    <p id="player-name"></p>
    
    <div class="button-group">
      <button class="mode-btn" data-time="10">10초</button>
      <button class="mode-btn" data-time="20">20초</button>
      <button class="mode-btn" data-time="30">30초</button>
      <button class="mode-btn" data-time="60">1분</button>
      <button class="mode-btn" data-time="infinite">무한 모드</button>
      <button class="mode-btn hard">하드 모드</button>
    </div>

    <div id="game-area">
      <img src="../../assets/namul.png" alt="나물" class="namul hidden" id="namul">
    </div>

    <div class="info">
      <p>⏱ 남은 시간: <span id="time">0</span></p>
      <p>🌿 점수: <span id="score">0</span></p>
    </div>

    <button id="restart-btn" class="hidden">다시하기</button>
  </div>

  <script src="../js/game.js"></script>
</body>
</html>
