<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>나물 줍기 게임</title>
  <link rel="stylesheet" href="../../assets/style/style.css"/>
</head>
<body>
  <!-- 닉네임 입력 -->
  <div id="nicknameSection" class="panel">
    <input type="text" id="nicknameInput" placeholder="닉네임 입력" />
    <button id="submitBtn">시작하기</button>
  </div>

  <!-- 게임 UI -->
  <div id="gameUI" class="panel" style="display:none;">
    <div class="hud">
      <h2 id="timerDisplay">시간: 0초</h2>
      <h3 id="scoreDisplay">점수: 0점</h3>
    </div>

    <div class="buttonGroup">
      <button class="modeBtn" data-time="10">10초</button>
      <button class="modeBtn" data-time="20">20초</button>
      <button class="modeBtn" data-time="30">30초</button>
      <button class="modeBtn" data-time="60">1분</button>
      <button class="modeBtn" data-time="infinite">무한모드</button>
    </div>

    <div class="buttonRow">
      <button id="replayBtn" style="display:none;">다시하기</button>
      <button id="bgmToggle">🔊 BGM</button>
    </div>
  </div>

  <!-- 게임 영역 -->
  <div id="gameArea" aria-label="game-area"></div>

  <!-- 풋터 & 언어 -->
  <footer>
    <p>&copy; cc 나물게임. All rights reserved.</p>
    <select id="langSelect">
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select>
  </footer>

  <audio id="bgm" loop src="../../assets/bgm.mp3"></audio>

  <!-- 스크립트들 -->
  <script src="../../lang/lang.js"></script>
  <script src="../js/game.js" defer></script>
</body>
</html>
