<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나물 줍기 게임</title>
  <link rel="stylesheet" href="../../assets/style/style.css">
</head>
<body>
  <div id="game-container">
      <div class="event-banner">
    🌱 이 게임에서 이벤트 진행 중! 참여하러 가기 🌱
  </div>
    <h1>나물 줍기 게임</h1>
    <div id="user-info">
      <span id="username">(게스트)</span>
    </div>

    <div id="mode-buttons">
      <button class="mode-btn" data-time="10">10초</button>
      <button class="mode-btn" data-time="20">20초</button>
      <button class="mode-btn" data-time="30">30초</button>
      <button class="mode-btn" data-time="60">1분</button>
      <button class="mode-btn" data-time="infinite">무한</button>
      <button class="hardModeBtn" data-time="hard">하드모드</button>
    </div>

    <div id="hud">
      <span id="timer">남은 시간: -</span>
      <span id="score">점수: 0</span>
    </div>

    <div id="field"></div>

    <div id="game-over" class="hidden">
      <h2>게임 종료!</h2>
      <p id="final-score"></p>
      <button id="restart-btn">다시하기</button>
    </div>
  </div>
  <script src="../js/game.js"></script>
</body>
</html>
