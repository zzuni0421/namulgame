<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 질문 시뮬레이터</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: radial-gradient(circle at 20% 20%, #0f172a, #020617); color: white; font-family: 'Pretendard', sans-serif; }
.glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
.scrollbar::-webkit-scrollbar { height:6px; }
.scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius:3px; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-6">

<header class="text-center mb-6">
<h1 class="text-4xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
AI 질문 시뮬레이터
</h1>
<p class="text-gray-400 mt-2">저장된 트레이닝 데이터를 기반으로 AI에게 질문할 수 있습니다.</p>
</header>

<main class="w-full max-w-4xl glass rounded-2xl p-6 space-y-8">

<section class="space-y-3">
<h2 class="text-2xl font-bold mb-2">질문 입력</h2>
<div class="flex flex-col md:flex-row gap-3">
<input id="questionInput" type="text" placeholder="질문 입력..." class="flex-1 p-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
<select id="categoryFilter" class="p-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none">
<option value="모두">모두</option>
<option value="일반">일반</option>
<option value="감정">감정</option>
<option value="지식">지식</option>
<option value="대화">대화</option>
</select>
<button id="askBtn" class="bg-gradient-to-r from-cyan-500 to-blue-500 px-5 py-3 rounded-lg font-semibold hover:opacity-90 transition">질문</button>
</div>
<div id="answerList" class="max-h-60 overflow-y-auto scrollbar space-y-2 mt-3"></div>
</section>

</main>

<script type="module">
async function loadDataAPI(key){
    try{ const res = await fetch(`/api/load?key=${encodeURIComponent(key)}`); const json=await res.json(); return json.data||[]; }
    catch(e){ console.error('Load API failed', e); return []; }
}

class AITrainer{
    constructor(storageKey='aiTrainingData'){ this.storageKey=storageKey; this.data=[]; }
    async init(){ this.data=await loadDataAPI(this.storageKey); }
    answer(question, category='모두'){
        if(!this.data.length) return "AI: 아직 학습된 데이터가 없습니다.";
        let candidates=this.data;
        if(category!=='모두') candidates=candidates.filter(d=>d.category===category);
        const match=candidates.find(d=>question.includes(d.keyword));
        return match ? match.answer : "AI: 관련 데이터가 없습니다.";
    }
}

const trainer=new AITrainer();
const questionInput=document.getElementById('questionInput');
const askBtn=document.getElementById('askBtn');
const answerList=document.getElementById('answerList');
const categoryFilter=document.getElementById('categoryFilter');

await trainer.init();

askBtn.addEventListener('click',()=>{
    const q=questionInput.value.trim();
    if(!q) return alert('질문을 입력하세요!');
    const ans=trainer.answer(q,categoryFilter.value);
    const div=document.createElement('div');
    div.className='p-3 rounded-lg bg-white/10 border border-white/20';
    div.textContent=`Q: ${q} → A: ${ans}`;
    answerList.prepend(div);
    questionInput.value='';
});
</script>
</body>
</html>
