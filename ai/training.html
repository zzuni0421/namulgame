<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 트레이닝 시뮬레이터</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
    background: radial-gradient(circle at 20% 20%, #0f172a, #020617);
    color: white;
    font-family: 'Pretendard', sans-serif;
}
.glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
}
.scrollbar::-webkit-scrollbar { height:6px; }
.scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius:3px; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-6">

<header class="text-center mb-6">
<h1 class="text-4xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
AI 트레이닝 시뮬레이터
</h1>
<p class="text-gray-400 mt-2">당신의 AI 모델을 직접 훈련시켜 보세요!</p>
</header>

<main class="w-full max-w-4xl glass rounded-2xl p-6 space-y-8">

<!-- 입력 섹션 -->
<section class="space-y-3">
<h2 class="text-2xl font-bold mb-2">데이터 입력</h2>
<div class="flex flex-col md:flex-row gap-3">
<input id="inputText" type="text" placeholder="훈련 데이터 입력..." 
class="flex-1 p-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
<select id="categorySelect" 
class="p-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none">
<option value="일반">일반</option>
<option value="감정">감정</option>
<option value="지식">지식</option>
<option value="대화">대화</option>
</select>
<button id="addDataBtn" 
class="bg-gradient-to-r from-cyan-500 to-blue-500 px-5 py-3 rounded-lg font-semibold hover:opacity-90 transition">
추가
</button>
</div>
</section>

<!-- 데이터 리스트 -->
<section>
<h2 class="text-2xl font-bold mb-2">훈련 데이터</h2>
<div id="dataList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-60 overflow-y-auto scrollbar"></div>
</section>

</main>

<script type="module">
// save.js
async function saveDataAPI(key, data){
    try{
        const res = await fetch('/api/save', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({key,data})
        });
        return await res.json();
    }catch(e){ console.error('Save API failed', e); }
}

// load.js
async function loadDataAPI(key){
    try{
        const res = await fetch(`/api/load?key=${encodeURIComponent(key)}`);
        const json = await res.json();
        return json.data || [];
    }catch(e){ console.error('Load API failed', e); return []; }
}

// ai.js
class AITrainer{
    constructor(storageKey='aiTrainingData'){
        this.storageKey = storageKey;
        this.data = [];
    }
    async init(){
        this.data = await loadDataAPI(this.storageKey);
        renderData();
    }
    async addEntry(text,category){
        const entry={text,category,timestamp:Date.now()};
        this.data.push(entry);
        await saveDataAPI(this.storageKey,this.data);
        renderData();
    }
    getData(){ return this.data; }
    predict(category){
        return this.data.filter(d=>d.category===category).slice(-3);
    }
}

const trainer = new AITrainer();
const inputText=document.getElementById('inputText');
const categorySelect=document.getElementById('categorySelect');
const addDataBtn=document.getElementById('addDataBtn');
const dataList=document.getElementById('dataList');

function renderData(){
    dataList.innerHTML='';
    trainer.getData().forEach(d=>{
        const div=document.createElement('div');
        div.className='p-3 rounded-lg bg-white/10 border border-white/20';
        div.textContent=`[${d.category}] ${d.text}`;
        dataList.appendChild(div);
    });
}

addDataBtn.addEventListener('click',()=>{
    const text=inputText.value.trim();
    const category=categorySelect.value;
    if(!text) return alert('내용을 입력하세요!');
    trainer.addEntry(text,category);
    inputText.value='';
});

trainer.init();
</script>
</body>
</html>
