<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 트레이닝 시뮬레이터</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: radial-gradient(circle at 20% 20%, #0f172a, #020617); color: white; font-family: 'Pretendard', sans-serif; }
.glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
.scrollbar::-webkit-scrollbar { height:6px; }
.scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius:3px; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-6">

<header class="text-center mb-6">
<h1 class="text-4xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
AI 트레이닝 시뮬레이터
</h1>
<p class="text-gray-400 mt-2">트레이닝 전용: 키워드+답변+카테고리 입력/관리</p>
</header>

<main class="w-full max-w-4xl glass rounded-2xl p-6 space-y-8">

<section class="space-y-3">
<h2 class="text-2xl font-bold mb-2">훈련 데이터 입력</h2>
<div class="flex flex-col md:flex-row gap-3">
<input id="keywordInput" type="text" placeholder="키워드 입력..." class="flex-1 p-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
<input id="answerInput" type="text" placeholder="답변 입력..." class="flex-1 p-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
<select id="categorySelect" class="p-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none">
<option value="일반">일반</option>
<option value="감정">감정</option>
<option value="지식">지식</option>
<option value="대화">대화</option>
</select>
<button id="addDataBtn" class="bg-gradient-to-r from-cyan-500 to-blue-500 px-5 py-3 rounded-lg font-semibold hover:opacity-90 transition">추가 / 저장</button>
</div>
</section>

<section>
<h2 class="text-2xl font-bold mb-2">학습 데이터</h2>
<div id="dataList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-60 overflow-y-auto scrollbar"></div>
</section>

</main>

<script type="module">
async function saveDataAPI(key, data){
    try{ const res = await fetch('/api/save',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({key,data}) }); return await res.json(); }
    catch(e){ console.error('Save API failed', e); }
}
async function loadDataAPI(key){
    try{ const res = await fetch(`/api/load?key=${encodeURIComponent(key)}`); const json=await res.json(); return json.data||[]; }
    catch(e){ console.error('Load API failed', e); return []; }
}

class AITrainer{
    constructor(storageKey='aiTrainingData'){ this.storageKey=storageKey; this.data=[]; }
    async init(){ this.data=await loadDataAPI(this.storageKey); renderData(); }
    async addEntry(keyword, answer, category, index=null){
        if(index!==null){ this.data[index]={...this.data[index], keyword, answer, category}; }
        else{ this.data.push({keyword, answer, category, timestamp:Date.now()}); }
        await saveDataAPI(this.storageKey,this.data); renderData();
    }
    async deleteEntry(index){ this.data.splice(index,1); await saveDataAPI(this.storageKey,this.data); renderData(); }
    getData(){ return this.data; }
}

const trainer=new AITrainer();
const keywordInput=document.getElementById('keywordInput');
const answerInput=document.getElementById('answerInput');
const categorySelect=document.getElementById('categorySelect');
const addDataBtn=document.getElementById('addDataBtn');
const dataList=document.getElementById('dataList');
let editIndex=null;

function renderData(){
    dataList.innerHTML='';
    trainer.getData().forEach((d,i)=>{
        const div=document.createElement('div');
        div.className='p-3 rounded-lg bg-white/10 border border-white/20 flex flex-col gap-1';
        div.innerHTML = `<div>[${d.category}] ${d.keyword} → ${d.answer}</div>
            <div class="flex gap-2 mt-1">
                <button data-edit="${i}" class="px-2 py-1 bg-yellow-500 text-black rounded hover:opacity-80">수정</button>
                <button data-delete="${i}" class="px-2 py-1 bg-red-500 text-black rounded hover:opacity-80">삭제</button>
            </div>`;
        dataList.appendChild(div);
    });

    dataList.querySelectorAll('[data-edit]').forEach(btn=>{
        btn.addEventListener('click',()=>{
            editIndex=parseInt(btn.dataset.edit);
            const d=trainer.getData()[editIndex];
            keywordInput.value=d.keyword; answerInput.value=d.answer; categorySelect.value=d.category;
        });
    });
    dataList.querySelectorAll('[data-delete]').forEach(btn=>{
        btn.addEventListener('click',()=>{ if(confirm('정말 삭제하시겠습니까?')){ trainer.deleteEntry(parseInt(btn.dataset.delete)); if(editIndex===parseInt(btn.dataset.delete)) editIndex=null; } });
    });
}

addDataBtn.addEventListener('click',()=>{
    const keyword=keywordInput.value.trim();
    const answer=answerInput.value.trim();
    const category=categorySelect.value;
    if(!keyword||!answer) return alert('키워드와 답변을 모두 입력하세요!');
    trainer.addEntry(keyword,answer,category,editIndex);
    keywordInput.value=''; answerInput.value=''; editIndex=null;
});

trainer.init();
</script>
</body>
</html>
