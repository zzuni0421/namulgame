<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나물 마을</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header">
  <div>코인: <span id="coin">0</span></div>
  <div>총 생산: <span id="totalProduce">0</span></div>
  <div>주민: <span id="resCount">0</span></div>
  <div>시장 레벨: <span id="marketLevel">1</span></div>
  <div>연구소 레벨: <span id="labLevel">1</span></div>
  <button id="btnSave">저장</button>
  <button id="btnLoad">불러오기</button>
</div>

<div class="section" id="mapSection">
  <h3>밭</h3>
  <div id="map"></div>
</div>

<div class="section" id="buildListSection">
  <h3>건물/주민</h3>
  <div id="buildList"></div>
</div>

<div class="section" id="codexSection">
  <h3>나물 도감</h3>
  <div id="codex"></div>
</div>

<div class="section">
  <h3>뉴스</h3>
  <div id="news"></div>
</div>

<script src="game.js"></script>
</body>
</html>
