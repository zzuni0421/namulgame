<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Namul Village - 나물마을</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
<header class="topbar">
<h1>나물마을 🌿</h1>
<div class="status">
<div>코인: <span id="coin">0</span></div>
<div>총 나물: <span id="totalProduce">0</span></div>
<div>주민: <span id="resCount">0</span></div>
</div>
<div class="controls">
<button id="btnSave">저장</button>
<button id="btnLoad">불러오기</button>
<select id="langSel"><option value="ko">한국어</option><option value="en">English</option></select>
</div>
</header>


<main class="village">
<section class="map" id="map"></section>
<aside class="panel">
<div class="card">
<h3>빌드 메뉴</h3>
<div id="buildList"></div>
</div>
<div class="card">
<h3>나물 도감</h3>
<div id="codex" class="codex"></div>
</div>
<div class="card small">
<h3>이벤트</h3>
<div id="news">환영합니다! 나물마을에 오신 것을 환영해요.</div>
</div>
</aside>
</main>


<footer class="bar">
<button id="openMarket">시장으로</button>
<button id="openResearch">연구소</button>
<button id="openFestival">축제</button>
</footer>
</div>


<script src="lang.js"></script>
<script src="data.js"></script>
<script src="save.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>
</body>
</html>
