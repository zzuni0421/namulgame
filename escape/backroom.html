<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백룸 탈출 게임</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow: hidden;
            cursor: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #d4d4aa 0%, #d4d4aa 50%, #8b8b5a 100%);
            perspective: 1000px;
            overflow: hidden;
        }

        #gameWorld {
            position: absolute;
            width: 200%;
            height: 200%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .wall {
            position: absolute;
            background: repeating-linear-gradient(
                0deg,
                #d4d4aa 0px,
                #d4d4aa 10px,
                #c4c49a 10px,
                #c4c49a 20px
            );
            border: 2px solid #8b8b5a;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
        }

        .floor {
            position: absolute;
            background: repeating-linear-gradient(
                45deg,
                #8b8b5a 0px,
                #8b8b5a 20px,
                #7a7a4a 20px,
                #7a7a4a 40px
            );
            transform: rotateX(90deg);
        }

        .ceiling {
            position: absolute;
            background: #6a6a3a;
            transform: rotateX(-90deg);
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        .light {
            position: absolute;
            width: 100px;
            height: 20px;
            background: linear-gradient(90deg, #fff 0%, #ffff99 50%, #fff 100%);
            border-radius: 10px;
            box-shadow: 0 0 200px rgba(255,255,153,0.3);
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
            75% { opacity: 0.9; }
        }

        #monster {
            position: absolute;
            width: 60px;
            height: 120px;
            background: #000;
            border-radius: 30px 30px 0 0;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 0 50px rgba(255,0,0,0.5);
        }

        #monster::before {
            content: '👁️👁️';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { opacity: 1; }
            95% { opacity: 0; }
        }

        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 40px;
            background: #4a90e2;
            border-radius: 10px;
            transform: translate(-50%, -50%);
            z-index: 50;
            transition: height 0.3s ease;
        }

        #player.crouching {
            height: 20px;
            background: #2a70c2;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #333;
        }

        #timer {
            font-size: 24px;
            color: #ff4444;
            margin-bottom: 10px;
        }

        #status {
            font-size: 16px;
            color: #44ff44;
        }

        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1000;
        }

        #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }

        #gameOverScreen h1 {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff4444;
        }

        #gameOverScreen button {
            padding: 15px 30px;
            font-size: 18px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }

        #gameOverScreen button:hover {
            background: #357abd;
        }

        #multiplayer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
        }

        #roomJoin {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #4a90e2;
            z-index: 3000;
            text-align: center;
        }

        #roomJoin input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #4a90e2;
            border-radius: 5px;
            background: #333;
            color: white;
            margin: 10px;
            width: 200px;
        }

        #roomJoin button {
            padding: 10px 20px;
            font-size: 16px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .otherPlayer {
            position: absolute;
            width: 20px;
            height: 40px;
            background: #e24a4a;
            border-radius: 10px;
            z-index: 45;
        }

        #exit {
            position: absolute;
            width: 80px;
            height: 120px;
            background: linear-gradient(180deg, #44ff44 0%, #228822 100%);
            border: 3px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 100px rgba(68,255,68,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .scary-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            z-index: 1500;
            opacity: 0;
            animation: scaryAppear 0.5s ease-in-out;
        }

        @keyframes scaryAppear {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .chat {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 300px;
            height: 150px;
            background: rgba(0,0,0,0.8);
            border-radius: 10px;
            padding: 10px;
            z-index: 1000;
            overflow-y: auto;
            font-size: 12px;
        }

        .chat-input {
            position: fixed;
            bottom: 60px;
            right: 20px;
            width: 280px;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 5px;
            color: white;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="roomJoin">
        <h2>백룸 탈출 게임</h2>
        <p>방에 참가하거나 새 방을 만드세요</p>
        <input type="text" id="playerNameInput" placeholder="당신의 이름을 입력하세요" maxlength="15" style="margin-bottom: 10px;">
        <br>
        <input type="text" id="roomCodeInput" placeholder="방 코드 입력 (예: ROOM-123)" maxlength="20">
        <br>
        <label style="font-size: 14px; margin: 10px 0; display: block;">
            <input type="checkbox" id="privateRoomCheck" style="margin-right: 5px;">
            비공개 방 만들기 (코드 입력 필수)
        </label>
        <button onclick="joinRoom()">방 참가</button>
        <button onclick="joinRandomRoom()">랜덤 방 참가</button>
        <button onclick="createRoom()">새 방 만들기</button>
        <button onclick="startSinglePlayer()">혼자 플레이</button>
        <div style="margin-top: 15px; font-size: 12px; color: #aaa;">
            💡 팁: 친구들과 같은 방 코드를 입력하면 함께 플레이할 수 있어요!
        </div>
    </div>

    <div id="gameContainer" style="display: none;">
        <div id="gameWorld">
            <!-- 벽들 -->
            <div class="wall" style="width: 10000px; height: 300px; top: 0; left: 0; transform: translateZ(0px);"></div>
            <div class="wall" style="width: 10000px; height: 300px; top: 0; left: 0; transform: translateZ(-2000px);"></div>
            <div class="wall" style="width: 2000px; height: 300px; top: 0; left: 0; transform: rotateY(90deg) translateZ(0px);"></div>
            <div class="wall" style="width: 2000px; height: 300px; top: 0; right: 0; transform: rotateY(-90deg) translateZ(0px);"></div>
            
            <!-- 중간 벽들 (미로 형태) -->
            <div class="wall" style="width: 800px; height: 300px; top: 0; left: 2000px; transform: rotateY(90deg) translateZ(0px);"></div>
            <div class="wall" style="width: 600px; height: 300px; top: 0; left: 4000px; transform: rotateY(90deg) translateZ(0px);"></div>
            <div class="wall" style="width: 700px; height: 300px; top: 0; left: 6000px; transform: rotateY(90deg) translateZ(0px);"></div>
            <div class="wall" style="width: 500px; height: 300px; top: 0; left: 8000px; transform: rotateY(90deg) translateZ(0px);"></div>
            
            <!-- 바닥과 천장 -->
            <div class="floor" style="width: 10000px; height: 2000px; top: 300px; left: 0;"></div>
            <div class="ceiling" style="width: 10000px; height: 2000px; top: 0; left: 0;"></div>
            
            <!-- 조명 -->
            <div class="light" style="top: 50px; left: 200px;"></div>
            <div class="light" style="top: 50px; left: 800px;"></div>
            <div class="light" style="top: 50px; left: 1400px;"></div>
            <div class="light" style="top: 50px; left: 2000px;"></div>
            <div class="light" style="top: 50px; left: 2600px;"></div>
            <div class="light" style="top: 50px; left: 3200px;"></div>
            <div class="light" style="top: 50px; left: 3800px;"></div>
            <div class="light" style="top: 50px; left: 4400px;"></div>
            <div class="light" style="top: 50px; left: 5000px;"></div>
            <div class="light" style="top: 50px; left: 5600px;"></div>
            <div class="light" style="top: 50px; left: 6200px;"></div>
            <div class="light" style="top: 50px; left: 6800px;"></div>
            <div class="light" style="top: 50px; left: 7400px;"></div>
            <div class="light" style="top: 50px; left: 8000px;"></div>
            <div class="light" style="top: 50px; left: 8600px;"></div>
            <div class="light" style="top: 50px; left: 9200px;"></div>
            
            <!-- 출구 -->
            <div id="exit" style="top: 180px; left: 9500px;"></div>
            
            <!-- 몬스터 -->
            <div id="monster" style="top: 180px; left: 800px;"></div>
            
            <!-- 플레이어 -->
            <div id="player"></div>
        </div>
    </div>

    <div id="ui" style="display: none;">
        <div id="timer">15:00</div>
        <div id="status">생존 중...</div>
        <div>점수: <span id="score">0</span></div>
    </div>

    <div id="instructions" style="display: none;">
        <strong>조작법:</strong><br>
        WASD: 이동<br>
        Shift: 웅크리기 (몬스터가 못 봄)<br>
        Enter: 채팅<br>
        목표: 녹색 출구에 도달하세요!
    </div>

    <div id="multiplayer" style="display: none;">
        <div>온라인 플레이어: <span id="playerCount">1</span></div>
        <div>방 코드: <span id="roomCode">-</span></div>
        <button onclick="copyRoomCode()" style="margin-top: 5px; padding: 5px 10px; background: #333; color: white; border: 1px solid #555; border-radius: 3px; cursor: pointer;">코드 복사</button>
    </div>

    <div id="chat" class="chat" style="display: none;"></div>
    <input type="text" id="chatInput" class="chat-input" placeholder="채팅을 입력하세요..." style="display: none;">

    <div id="gameOverScreen">
        <h1 id="gameOverTitle">게임 오버</h1>
        <p id="gameOverMessage">몬스터에게 잡혔습니다...</p>
        <button onclick="restartGame()">다시 시작</button>
        <button onclick="backToLobby()">로비로 돌아가기</button>
    </div>

    <script>
        // 게임 상태
        let gameState = {
            playerX: 100,
            playerY: 200,
            playerZ: 0,
            rotation: 0,
            isCrouching: false,
            isAlive: true,
            timeLeft: 900, // 15분
            score: 0,
            monsterX: 800,
            monsterY: 180,
            monsterSpeed: 0.5,
            monsterDirection: 1,
            lastMonsterMove: 0,
            scareEvents: 0,
            gameStarted: false
        };

        // 멀티플레이어 상태
        let multiplayerState = {
            isMultiplayer: false,
            roomCode: '',
            players: new Map(),
            chatMessages: [],
            playerId: 'player_' + Math.random().toString(36).substr(2, 9),
            playerName: '플레이어' + Math.floor(Math.random() * 1000),
            ws: null,
            isHost: false
        };

        // 실시간 통신을 위한 P2P 연결 시뮬레이션
        class MultiplayerManager {
            constructor() {
                this.connections = new Map();
                this.messageQueue = [];
                this.isConnected = false;
            }

            // 방 생성
            createRoom(roomCode) {
                multiplayerState.isHost = true;
                multiplayerState.roomCode = roomCode;
                this.isConnected = true;
                
                // 실제 서버 연결 시뮬레이션
                this.simulateServerConnection();
                
                return true;
            }

            // 방 참가
            joinRoom(roomCode) {
                multiplayerState.roomCode = roomCode;
                this.isConnected = true;
                
                // 실제 서버 연결 시뮬레이션
                this.simulateServerConnection();
                
                // 기존 플레이어들 시뮬레이션
                setTimeout(() => {
                    this.addRandomPlayers();
                }, 1000);
                
                return true;
            }

            // 서버 연결 시뮬레이션
            simulateServerConnection() {
                // 실제로는 WebSocket 서버에 연결
                console.log(`연결됨: 방 ${multiplayerState.roomCode}`);
                
                // 주기적으로 다른 플레이어 데이터 업데이트
                setInterval(() => {
                    this.updateOtherPlayersData();
                }, 100);

                // 랜덤 채팅 메시지 시뮬레이션
                setInterval(() => {
                    if (Math.random() < 0.01 && multiplayerState.players.size > 0) {
                        this.simulateRandomChat();
                    }
                }, 2000);
            }

            // 랜덤 플레이어 추가
            addRandomPlayers() {
                const names = ['김철수', '이영희', '박민수', '최지영', '정다은', '홍길동'];
                const playerCount = Math.floor(Math.random() * 4) + 1;
                
                for (let i = 0; i < playerCount; i++) {
                    const playerId = 'remote_' + Math.random().toString(36).substr(2, 9);
                    const playerData = {
                        id: playerId,
                        name: names[Math.floor(Math.random() * names.length)],
                        x: 100 + Math.random() * 300,
                        y: 200 + Math.random() * 200,
                        isCrouching: false,
                        isAlive: true,
                        lastUpdate: Date.now()
                    };
                    
                    multiplayerState.players.set(playerId, playerData);
                    this.broadcastMessage('player_joined', playerData);
                }
                
                updatePlayerCount();
            }

            // 다른 플레이어 데이터 업데이트
            updateOtherPlayersData() {
                multiplayerState.players.forEach((player, playerId) => {
                    if (player.isAlive) {
                        // 실제로는 서버에서 받은 데이터로 업데이트
                        // 여기서는 AI 움직임 시뮬레이션
                        const targetX = gameState.playerX + (Math.random() - 0.5) * 400;
                        const targetY = gameState.playerY + (Math.random() - 0.5) * 400;
                        
                        const dx = targetX - player.x;
                        const dy = targetY - player.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance > 10) {
                            player.x += (dx / distance) * 2;
                            player.y += (dy / distance) * 2;
                        }
                        
                        // 경계 체크
                        player.x = Math.max(50, Math.min(9950, player.x));
                        player.y = Math.max(50, Math.min(1950, player.y));
                        
                        // 몬스터와의 거리 체크
                        const monsterDx = player.x - gameState.monsterX;
                        const monsterDy = player.y - gameState.monsterY;
                        const monsterDistance = Math.sqrt(monsterDx * monsterDx + monsterDy * monsterDy);
                        
                        if (monsterDistance < 60 && Math.random() < 0.005) {
                            player.isAlive = false;
                            this.broadcastMessage('player_died', { playerId, playerName: player.name });
                        }
                        
                        // 웅크리기 랜덤
                        if (monsterDistance < 150 && Math.random() < 0.1) {
                            player.isCrouching = !player.isCrouching;
                        }
                    }
                });
            }

            // 랜덤 채팅 시뮬레이션
            simulateRandomChat() {
                const messages = [
                    '도와줘!', '몬스터가 온다!', '출구 어디야?', '같이 가자!', 
                    '조심해!', '웅크려!', '이쪽으로!', '살려줘!', '거의 다 왔어!',
                    '시간이 얼마 안 남았어', '몬스터 피해!', '출구 찾았다!'
                ];
                
                const players = Array.from(multiplayerState.players.values()).filter(p => p.isAlive);
                if (players.length > 0) {
                    const randomPlayer = players[Math.floor(Math.random() * players.length)];
                    const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                    
                    this.receiveMessage('chat', {
                        playerId: randomPlayer.id,
                        playerName: randomPlayer.name,
                        message: randomMessage
                    });
                }
            }

            // 메시지 전송
            broadcastMessage(type, data) {
                const message = {
                    type,
                    data,
                    playerId: multiplayerState.playerId,
                    playerName: multiplayerState.playerName,
                    timestamp: Date.now()
                };
                
                // 실제로는 서버로 전송
                console.log('전송:', message);
                
                // 즉시 처리 (로컬 테스트용)
                setTimeout(() => {
                    this.receiveMessage(type, data);
                }, 50 + Math.random() * 100);
            }

            // 메시지 수신
            receiveMessage(type, data) {
                switch (type) {
                    case 'chat':
                        if (data.playerId !== multiplayerState.playerId) {
                            addChatMessage(data.playerName, data.message);
                        }
                        break;
                    case 'player_joined':
                        addChatMessage('시스템', `${data.name}님이 참가했습니다!`);
                        break;
                    case 'player_died':
                        if (data.playerId !== multiplayerState.playerId) {
                            addChatMessage('시스템', `${data.playerName}님이 몬스터에게 잡혔습니다!`);
                        }
                        break;
                    case 'player_escaped':
                        addChatMessage('시스템', `${data.playerName}님이 탈출했습니다!`);
                        break;
                }
            }

            // 플레이어 위치 전송
            sendPlayerUpdate() {
                if (this.isConnected) {
                    this.broadcastMessage('player_update', {
                        x: gameState.playerX,
                        y: gameState.playerY,
                        isCrouching: gameState.isCrouching,
                        isAlive: gameState.isAlive
                    });
                }
            }

            // 채팅 메시지 전송
            sendChatMessage(message) {
                if (this.isConnected) {
                    this.broadcastMessage('chat', {
                        playerId: multiplayerState.playerId,
                        playerName: multiplayerState.playerName,
                        message: message
                    });
                }
            }

            // 연결 해제
            disconnect() {
                this.isConnected = false;
                multiplayerState.players.clear();
                console.log('연결 해제됨');
            }
        }

        // 멀티플레이어 매니저 인스턴스
        const mpManager = new MultiplayerManager();

        // DOM 요소들
        const gameContainer = document.getElementById('gameContainer');
        const gameWorld = document.getElementById('gameWorld');
        const player = document.getElementById('player');
        const monster = document.getElementById('monster');
        const timer = document.getElementById('timer');
        const status = document.getElementById('status');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const playerCount = document.getElementById('playerCount');
        const roomJoin = document.getElementById('roomJoin');
        const ui = document.getElementById('ui');
        const instructions = document.getElementById('instructions');
        const multiplayerUI = document.getElementById('multiplayer');
        const chat = document.getElementById('chat');
        const chatInput = document.getElementById('chatInput');

        // 키 입력 상태
        const keys = {};

        // 랜덤 방 참가
        function joinRandomRoom() {
            const playerName = document.getElementById('playerNameInput').value.trim();
            
            if (playerName) {
                multiplayerState.playerName = playerName;
            }
            
            // 랜덤 방 코드 생성 (공개 방들 중에서)
            const publicRooms = ['PUBLIC-001', 'PUBLIC-002', 'PUBLIC-003', 'PUBLIC-004', 'PUBLIC-005'];
            const randomRoom = publicRooms[Math.floor(Math.random() * publicRooms.length)];
            
            multiplayerState.isMultiplayer = true;
            document.getElementById('roomCode').textContent = randomRoom;
            
            if (mpManager.joinRoom(randomRoom)) {
                startGame();
                addChatMessage('시스템', `랜덤 방 ${randomRoom}에 참가했습니다!`);
                addChatMessage('시스템', `당신의 이름: ${multiplayerState.playerName}`);
            } else {
                alert('랜덤 방 참가에 실패했습니다!');
            }
        }

        // 방 참가
        function joinRoom() {
            const roomCode = document.getElementById('roomCodeInput').value.trim();
            const playerName = document.getElementById('playerNameInput').value.trim();
            
            if (!roomCode) {
                alert('방 코드를 입력해주세요!');
                return;
            }
            
            if (playerName) {
                multiplayerState.playerName = playerName;
            }
            
            multiplayerState.isMultiplayer = true;
            document.getElementById('roomCode').textContent = roomCode;
            
            // 실제 멀티플레이어 연결
            if (mpManager.joinRoom(roomCode)) {
                startGame();
                addChatMessage('시스템', `방 ${roomCode}에 참가했습니다!`);
                addChatMessage('시스템', `당신의 이름: ${multiplayerState.playerName}`);
            } else {
                alert('방 참가에 실패했습니다!');
            }
        }

        // 새 방 만들기
        function createRoom() {
            const playerName = document.getElementById('playerNameInput').value.trim();
            const isPrivate = document.getElementById('privateRoomCheck').checked;
            let roomCode;
            
            if (isPrivate) {
                roomCode = 'PRIVATE-' + Math.random().toString(36).substr(2, 8).toUpperCase();
            } else {
                roomCode = 'PUBLIC-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            }
            
            if (playerName) {
                multiplayerState.playerName = playerName;
            }
            
            multiplayerState.isMultiplayer = true;
            document.getElementById('roomCode').textContent = roomCode;
            
            // 실제 멀티플레이어 연결
            if (mpManager.createRoom(roomCode)) {
                startGame();
                const roomType = isPrivate ? '비공개' : '공개';
                addChatMessage('시스템', `새 ${roomType} 방 ${roomCode}을 만들었습니다!`);
                addChatMessage('시스템', `당신의 이름: ${multiplayerState.playerName}`);
                if (isPrivate) {
                    addChatMessage('시스템', '이 방은 비공개 방입니다. 코드를 친구들에게 공유하세요!');
                }
                addChatMessage('시스템', '친구들이 참가할 때까지 기다리세요...');
            } else {
                alert('방 생성에 실패했습니다!');
            }
        }

        // 혼자 플레이
        function startSinglePlayer() {
            multiplayerState.isMultiplayer = false;
            startGame();
        }

        // 게임 시작
        function startGame() {
            roomJoin.style.display = 'none';
            gameContainer.style.display = 'block';
            ui.style.display = 'block';
            instructions.style.display = 'block';
            
            if (multiplayerState.isMultiplayer) {
                multiplayerUI.style.display = 'block';
                chat.style.display = 'block';
                chatInput.style.display = 'block';
            }
            
            gameState.gameStarted = true;
            gameLoop();
            setInterval(updateTimer, 1000);
            
            // 초기 위치 설정
            player.style.left = gameState.playerX + 'px';
            player.style.top = gameState.playerY + 'px';
            monster.style.left = gameState.monsterX + 'px';
            monster.style.top = gameState.monsterY + 'px';
        }

        // 시뮬레이션된 플레이어들 추가
        function addSimulatedPlayers() {
            const playerNames = ['김철수', '이영희', '박민수', '최지영'];
            const playerCount = Math.floor(Math.random() * 3) + 1; // 1-3명
            
            for (let i = 0; i < playerCount; i++) {
                const playerId = 'player_' + i;
                multiplayerState.players.set(playerId, {
                    name: playerNames[i] || `플레이어${i+1}`,
                    x: 100 + Math.random() * 200,
                    y: 200 + Math.random() * 100,
                    isAlive: true
                });
            }
            
            updatePlayerCount();
        }

        // 플레이어 수 업데이트
        function updatePlayerCount() {
            const count = multiplayerState.players.size + 1;
            playerCount.textContent = count;
        }

        // 채팅 메시지 추가
        function addChatMessage(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
            chat.appendChild(messageElement);
            chat.scrollTop = chat.scrollHeight;
            
            // 메시지 제한 (최대 50개)
            while (chat.children.length > 50) {
                chat.removeChild(chat.firstChild);
            }
        }

        // 방 코드 복사
        function copyRoomCode() {
            navigator.clipboard.writeText(multiplayerState.roomCode).then(() => {
                addChatMessage('시스템', '방 코드가 클립보드에 복사되었습니다!');
            });
        }

        // 로비로 돌아가기
        function backToLobby() {
            gameState.gameStarted = false;
            gameOverScreen.style.display = 'none';
            gameContainer.style.display = 'none';
            ui.style.display = 'none';
            instructions.style.display = 'none';
            multiplayerUI.style.display = 'none';
            chat.style.display = 'none';
            chatInput.style.display = 'none';
            roomJoin.style.display = 'block';
            
            // 멀티플레이어 연결 해제
            if (multiplayerState.isMultiplayer) {
                mpManager.disconnect();
                multiplayerState.isMultiplayer = false;
            }
            
            // 상태 초기화
            multiplayerState.players.clear();
            document.getElementById('roomCodeInput').value = '';
            
            // 채팅 초기화
            chat.innerHTML = '';
        }

        // 이벤트 리스너
        document.addEventListener('keydown', (e) => {
            if (!gameState.gameStarted) return;
            
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === 'Shift') {
                gameState.isCrouching = true;
                player.classList.add('crouching');
            }
            
            if (e.key === 'Enter') {
                e.preventDefault();
                if (multiplayerState.isMultiplayer && chatInput.style.display !== 'none') {
                    const message = chatInput.value.trim();
                    if (message) {
                        // 내 메시지 즉시 표시
                        addChatMessage('나', message);
                        
                        // 다른 플레이어들에게 전송
                        mpManager.sendChatMessage(message);
                        
                        chatInput.value = '';
                    }
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!gameState.gameStarted) return;
            
            keys[e.key.toLowerCase()] = false;
            
            if (e.key === 'Shift') {
                gameState.isCrouching = false;
                player.classList.remove('crouching');
            }
        });

        // 플레이어 이동
        function movePlayer() {
            if (!gameState.isAlive || !gameState.gameStarted) return;

            const speed = gameState.isCrouching ? 0 : 1.5;
            let moved = false;
            
            if (keys['w'] || keys['arrowup']) {
                gameState.playerY -= speed;
                moved = true;
            }
            if (keys['s'] || keys['arrowdown']) {
                if (!gameState.isCrouching) {
                    gameState.playerY += speed;
                    moved = true;
                }
            }
            if (keys['a'] || keys['arrowleft']) {
                gameState.playerX -= speed;
                moved = true;
            }
            if (keys['d'] || keys['arrowright']) {
                gameState.playerX += speed;
                moved = true;
            }

            // 경계 체크
            gameState.playerX = Math.max(50, Math.min(9950, gameState.playerX));
            gameState.playerY = Math.max(50, Math.min(1950, gameState.playerY));

            // 플레이어 위치 업데이트
            player.style.left = gameState.playerX + 'px';
            player.style.top = gameState.playerY + 'px';

            // 카메라 따라가기
            const translateX = -gameState.playerX + window.innerWidth / 2;
            const translateY = -gameState.playerY + window.innerHeight / 2;
            gameWorld.style.transform = `translate(${translateX}px, ${translateY}px)`;

            // 멀티플레이어에서 위치 동기화
            if (moved && multiplayerState.isMultiplayer) {
                mpManager.sendPlayerUpdate();
            }
        }

        // 몬스터 AI
        function moveMonster() {
            if (!gameState.isAlive || !gameState.gameStarted) return;

            const now = Date.now();
            if (now - gameState.lastMonsterMove < 100) return;
            
            gameState.lastMonsterMove = now;

            // 플레이어와의 거리 계산
            const dx = gameState.playerX - gameState.monsterX;
            const dy = gameState.playerY - gameState.monsterY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // 웅크리고 있으면 몬스터가 못 봄
            if (gameState.isCrouching && distance > 100) {
                // 랜덤 이동
                gameState.monsterX += (Math.random() - 0.5) * 2;
                gameState.monsterY += (Math.random() - 0.5) * 2;
            } else {
                // 플레이어 추적
                if (distance > 5) {
                    gameState.monsterX += (dx / distance) * gameState.monsterSpeed;
                    gameState.monsterY += (dy / distance) * gameState.monsterSpeed;
                }
            }

            // 몬스터 위치 업데이트
            monster.style.left = gameState.monsterX + 'px';
            monster.style.top = gameState.monsterY + 'px';

            // 충돌 검사
            if (distance < 50 && !gameState.isCrouching) {
                endGame('몬스터에게 잡혔습니다...');
            }

            // 무서운 이벤트
            if (distance < 200 && Math.random() < 0.01) {
                createScareEvent();
            }
        }

        // 무서운 이벤트 생성
        function createScareEvent() {
            const scaryTexts = ['뒤를 보지 마...', '너를 찾았다...', '도망칠 수 없어...', '이미 늦었어...'];
            const text = scaryTexts[Math.floor(Math.random() * scaryTexts.length)];
            
            const scaryElement = document.createElement('div');
            scaryElement.className = 'scary-text';
            scaryElement.textContent = text;
            document.body.appendChild(scaryElement);

            setTimeout(() => {
                if (document.body.contains(scaryElement)) {
                    document.body.removeChild(scaryElement);
                }
            }, 500);

            // 화면 흔들기
            document.body.style.animation = 'shake 0.5s ease-in-out';
            setTimeout(() => {
                document.body.style.animation = '';
            }, 500);
        }

        // 다른 플레이어 업데이트
        function updateOtherPlayers() {
            if (!multiplayerState.isMultiplayer) return;

            multiplayerState.players.forEach((playerData, playerId) => {
                let playerElement = document.getElementById(playerId);
                
                if (playerData.isAlive) {
                    // 요소가 없으면 생성
                    if (!playerElement) {
                        playerElement = document.createElement('div');
                        playerElement.id = playerId;
                        playerElement.className = 'otherPlayer';
                        playerElement.title = playerData.name;
                        
                        // 플레이어 이름 표시
                        const nameTag = document.createElement('div');
                        nameTag.style.cssText = `
                            position: absolute;
                            top: -25px;
                            left: 50%;
                            transform: translateX(-50%);
                            background: rgba(0,0,0,0.7);
                            color: white;
                            padding: 2px 6px;
                            border-radius: 3px;
                            font-size: 10px;
                            white-space: nowrap;
                            pointer-events: none;
                        `;
                        nameTag.textContent = playerData.name;
                        playerElement.appendChild(nameTag);
                        
                        gameWorld.appendChild(playerElement);
                    }
                    
                    // 위치 업데이트
                    playerElement.style.left = playerData.x + 'px';
                    playerElement.style.top = playerData.y + 'px';
                    
                    // 웅크리기 상태 반영
                    if (playerData.isCrouching) {
                        playerElement.style.height = '20px';
                        playerElement.style.background = '#c24a4a';
                    } else {
                        playerElement.style.height = '40px';
                        playerElement.style.background = '#e24a4a';
                    }
                    
                } else {
                    // 죽은 플레이어는 제거
                    if (playerElement) {
                        playerElement.remove();
                    }
                }
            });
        }

        // 출구 체크
        function checkExit() {
            const exitX = 9500;
            const exitY = 180;
            const dx = gameState.playerX - exitX;
            const dy = gameState.playerY - exitY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 60) {
                winGame();
            }
        }

        // 타이머 업데이트
        function updateTimer() {
            if (!gameState.isAlive || !gameState.gameStarted) return;

            gameState.timeLeft--;
            const minutes = Math.floor(gameState.timeLeft / 60);
            const seconds = gameState.timeLeft % 60;
            timer.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            if (gameState.timeLeft <= 0) {
                endGame('시간 초과!');
            }

            // 점수 업데이트 (남은 시간이 점수)
            gameState.score = gameState.timeLeft;
            scoreElement.textContent = gameState.score;

            // 몬스터 속도 증가
            if (gameState.timeLeft % 60 === 0) {
                gameState.monsterSpeed += 0.2;
            }
        }

        // 게임 종료
        function endGame(reason = '몬스터에게 잡혔습니다...') {
            gameState.isAlive = false;
            document.getElementById('gameOverTitle').textContent = '게임 오버';
            document.getElementById('gameOverMessage').textContent = reason;
            gameOverScreen.style.display = 'flex';
            status.textContent = '사망';
            status.style.color = '#ff4444';
            
            if (multiplayerState.isMultiplayer) {
                addChatMessage('시스템', '당신이 사망했습니다.');
                mpManager.broadcastMessage('player_died', {
                    playerId: multiplayerState.playerId,
                    playerName: multiplayerState.playerName
                });
            }
        }

        // 게임 승리
        function winGame() {
            gameState.isAlive = false;
            document.getElementById('gameOverTitle').textContent = '탈출 성공!';
            document.getElementById('gameOverTitle').style.color = '#44ff44';
            document.getElementById('gameOverMessage').textContent = `축하합니다! ${Math.floor(gameState.timeLeft / 60)}분 ${gameState.timeLeft % 60}초 남기고 탈출했습니다!`;
            gameOverScreen.style.display = 'flex';
            status.textContent = '탈출 성공!';
            status.style.color = '#44ff44';
            
            if (multiplayerState.isMultiplayer) {
                addChatMessage('시스템', '탈출에 성공했습니다!');
                mpManager.broadcastMessage('player_escaped', {
                    playerId: multiplayerState.playerId,
                    playerName: multiplayerState.playerName
                });
            }
        }

        // 게임 재시작
        function restartGame() {
            gameState = {
                playerX: 100,
                playerY: 200,
                playerZ: 0,
                rotation: 0,
                isCrouching: false,
                isAlive: true,
                timeLeft: 900,
                score: 0,
                monsterX: 800,
                monsterY: 180,
                monsterSpeed: 0.5,
                monsterDirection: 1,
                lastMonsterMove: 0,
                scareEvents: 0,
                gameStarted: true
            };

            gameOverScreen.style.display = 'none';
            status.textContent = '생존 중...';
            status.style.color = '#44ff44';
            document.getElementById('gameOverTitle').style.color = '#ff4444';
            player.classList.remove('crouching');
            
            // 플레이어들 부활
            multiplayerState.players.forEach(playerData => {
                playerData.isAlive = true;
                playerData.x = 100 + Math.random() * 200;
                playerData.y = 200 + Math.random() * 100;
            });
            
            if (multiplayerState.isMultiplayer) {
                addChatMessage('시스템', '게임이 재시작되었습니다!');
            }
        }

        // 게임 루프
        function gameLoop() {
            if (gameState.gameStarted) {
                movePlayer();
                moveMonster();
                updateOtherPlayers();
                checkExit();
            }
            requestAnimationFrame(gameLoop);
        }
    </script>
