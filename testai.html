<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 채팅 - 사용량 관리 시스템</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 1000px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .header-title {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .header-subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .usage-info {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 10px 15px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            text-align: right;
        }

        .usage-connected {
            background: rgba(76, 175, 80, 0.3);
        }

        .usage-warning {
            background: rgba(255, 193, 7, 0.3);
        }

        .usage-blocked {
            background: rgba(244, 67, 54, 0.3);
        }

        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 75%;
            padding: 18px 24px;
            border-radius: 20px;
            word-wrap: break-word;
            animation: messageSlide 0.4s ease-out;
            line-height: 1.5;
        }

        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 8px;
        }

        .ai-message {
            background: white;
            color: #333;
            align-self: flex-start;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .system-message {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            align-self: center;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
        }

        .message-meta {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: white;
            padding: 18px 24px;
            border-radius: 20px;
            border-bottom-left-radius: 8px;
            border: 1px solid #e9ecef;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .typing-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .typing-dot {
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
            animation: typingPulse 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .typing-text {
            margin-left: 12px;
            color: #666;
            font-style: italic;
        }

        .input-area {
            padding: 25px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .api-setup {
            background: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .api-setup h3 {
            margin: 0 0 15px 0;
            color: #1976d2;
            font-size: 18px;
        }

        .api-input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .api-input {
            flex: 1;
            min-width: 300px;
            padding: 12px 16px;
            border: 2px solid #e3f2fd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .api-input:focus {
            border-color: #2196f3;
        }

        .api-connect-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .api-connect-btn:hover {
            background: #1976d2;
        }

        .chat-input-container {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 18px 24px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            resize: none;
            min-height: 24px;
            max-height: 120px;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 90px;
        }

        .send-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .usage-limit-warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            color: #856404;
        }

        .usage-limit-blocked {
            background: #f8d7da;
            border: 2px solid #dc3545;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            color: #721c24;
        }

        .usage-progress {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }

        .usage-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #ffc107, #dc3545);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .quick-prompts {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .quick-prompt-btn {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-prompt-btn:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .quick-prompt-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes typingPulse {
            0%, 60%, 100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            30% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                height: 95vh;
            }
            
            .message {
                max-width: 85%;
            }
            
            .api-input-group {
                flex-direction: column;
            }
            
            .api-input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div class="usage-info" id="usageInfo">
                <div>🔄 연결 대기중</div>
            </div>
            <h1 class="header-title">🤖 AI 채팅</h1>
            <div class="header-subtitle">사용량 관리 • 무료 한도 모니터링</div>
        </header>
        
        <div class="chat-messages" id="chatMessages">
            <div class="system-message">
                실제 AI와 대화하려면 OpenAI API 키를 입력해주세요 🔑
                <div class="message-meta">
                    <span>시스템</span>
                    <span id="systemTime"></span>
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <span class="typing-text">AI가 응답을 생성하고 있습니다...</span>
            </div>
        </div>
        
        <div class="input-area">
            <div class="api-setup" id="apiSetup">
                <h3>🔐 사용자 인증</h3>
                <div class="api-input-group">
                    <input 
                        type="text" 
                        id="userIdInput" 
                        class="api-input" 
                        placeholder="사용자 ID를 입력하세요 (예: user123)"
                        style="min-width: 200px;"
                    >
                    <button class="api-connect-btn" onclick="connectUser()">시작하기</button>
                </div>
                <p style="margin: 15px 0 0 0; font-size: 12px; color: #666;">
                    각 사용자는 일일 20회 무료 사용 가능 • 사용량은 자동으로 관리됩니다
                </p>
            </div>
            
            <div class="usage-limit-warning" id="usageWarning" style="display: none;">
                <h4>⚠️ 사용량 경고</h4>
                <p>일일 무료 사용 한도에 거의 도달했습니다.</p>
                <div class="usage-progress">
                    <div class="usage-progress-bar" id="usageProgressBar"></div>
                </div>
                <p id="usageText">남은 사용량: 0/20</p>
            </div>
            
            <div class="usage-limit-blocked" id="usageBlocked" style="display: none;">
                <h4>🚫 사용량 한도 초과</h4>
                <p>오늘의 무료 사용량 20회를 모두 사용했습니다.</p>
                <p>내일 자정에 사용량이 초기화됩니다.</p>
                <div class="usage-progress">
                    <div class="usage-progress-bar" style="width: 100%;"></div>
                </div>
                <p>사용량: 20/20 (100%)</p>
            </div>
            
            <div class="quick-prompts" id="quickPrompts" style="display: none;">
                <button class="quick-prompt-btn" onclick="quickPrompt('안녕하세요! 자기소개를 해주세요.')">인사하기</button>
                <button class="quick-prompt-btn" onclick="quickPrompt('오늘 날씨에 대해 어떻게 생각하세요?')">일상 대화</button>
                <button class="quick-prompt-btn" onclick="quickPrompt('창작 아이디어를 제안해주세요.')">창작 도움</button>
                <button class="quick-prompt-btn" onclick="quickPrompt('프로그래밍 질문이 있어요.')">기술 질문</button>
            </div>
            
            <form class="chat-input-container" id="chatForm" style="display: none;">
                <label for="messageInput" class="sr-only">메시지 입력</label>
                <textarea 
                    id="messageInput" 
                    class="chat-input" 
                    placeholder="실제 AI에게 무엇이든 물어보세요..." 
                    rows="1"
                ></textarea>
                <button type="submit" class="send-button" id="sendButton">전송</button>
            </form>
        </div>
    </main>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatForm = document.getElementById('chatForm');
        const typingIndicator = document.getElementById('typingIndicator');
        const usageInfo = document.getElementById('usageInfo');
        const apiSetup = document.getElementById('apiSetup');
        const quickPrompts = document.getElementById('quickPrompts');
        const systemTime = document.getElementById('systemTime');
        const usageWarning = document.getElementById('usageWarning');
        const usageBlocked = document.getElementById('usageBlocked');
        const usageProgressBar = document.getElementById('usageProgressBar');
        const usageText = document.getElementById('usageText');

        // 공용 API 키 (실제 서비스에서는 서버에서 관리)
        const SHARED_API_KEY = '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';
        const DAILY_LIMIT = 20;
        
        let currentUser = '';
        let conversationHistory = [];
        let isConnected = false;
        let userUsage = {};

        // 시스템 시간 설정
        if (systemTime) systemTime.textContent = getCurrentTime();

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('ko-KR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function getTodayKey() {
            const today = new Date();
            return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
        }

        function loadUserUsage() {
            const savedUsage = localStorage.getItem('aiChatUsage');
            if (savedUsage) {
                userUsage = JSON.parse(savedUsage);
            }
            
            // 오늘 날짜가 아닌 데이터는 삭제
            const todayKey = getTodayKey();
            const cleanedUsage = {};
            
            for (const [user, data] of Object.entries(userUsage)) {
                if (data.date === todayKey) {
                    cleanedUsage[user] = data;
                }
            }
            
            userUsage = cleanedUsage;
            saveUserUsage();
        }

        function saveUserUsage() {
            localStorage.setItem('aiChatUsage', JSON.stringify(userUsage));
        }

        function getUserUsageCount(userId) {
            const todayKey = getTodayKey();
            if (!userUsage[userId] || userUsage[userId].date !== todayKey) {
                userUsage[userId] = {
                    count: 0,
                    date: todayKey
                };
                saveUserUsage();
            }
            return userUsage[userId].count;
        }

        function incrementUserUsage(userId) {
            const todayKey = getTodayKey();
            if (!userUsage[userId] || userUsage[userId].date !== todayKey) {
                userUsage[userId] = {
                    count: 0,
                    date: todayKey
                };
            }
            userUsage[userId].count++;
            saveUserUsage();
        }

        function updateUsageDisplay() {
            if (!currentUser) return;
            
            const usage = getUserUsageCount(currentUser);
            const percentage = (usage / DAILY_LIMIT) * 100;
            
            // 헤더 사용량 표시 업데이트
            if (usage >= DAILY_LIMIT) {
                usageInfo.innerHTML = `
                    <div>🚫 한도 초과</div>
                    <div>${usage}/${DAILY_LIMIT} (100%)</div>
                `;
                usageInfo.className = 'usage-info usage-blocked';
            } else if (usage >= DAILY_LIMIT * 0.8) {
                usageInfo.innerHTML = `
                    <div>⚠️ 경고</div>
                    <div>${usage}/${DAILY_LIMIT} (${Math.round(percentage)}%)</div>
                `;
                usageInfo.className = 'usage-info usage-warning';
            } else {
                usageInfo.innerHTML = `
                    <div>✅ 정상</div>
                    <div>${usage}/${DAILY_LIMIT} (${Math.round(percentage)}%)</div>
                `;
                usageInfo.className = 'usage-info usage-connected';
            }
            
            // 경고 및 차단 메시지 표시
            if (usage >= DAILY_LIMIT) {
                usageWarning.style.display = 'none';
                usageBlocked.style.display = 'block';
                disableChat();
            } else if (usage >= DAILY_LIMIT * 0.8) {
                usageWarning.style.display = 'block';
                usageBlocked.style.display = 'none';
                
                if (usageProgressBar) {
                    usageProgressBar.style.width = percentage + '%';
                }
                if (usageText) {
                    usageText.textContent = `남은 사용량: ${DAILY_LIMIT - usage}/${DAILY_LIMIT}`;
                }
            } else {
                usageWarning.style.display = 'none';
                usageBlocked.style.display = 'none';
            }
        }

        function disableChat() {
            sendButton.disabled = true;
            messageInput.disabled = true;
            messageInput.placeholder = '일일 사용량을 초과했습니다. 내일 다시 이용해주세요.';
            
            // 퀵 프롬프트 버튼들 비활성화
            const quickBtns = document.querySelectorAll('.quick-prompt-btn');
            quickBtns.forEach(btn => btn.disabled = true);
        }

        function enableChat() {
            sendButton.disabled = false;
            messageInput.disabled = false;
            messageInput.placeholder = '실제 AI에게 무엇이든 물어보세요...';
            
            // 퀵 프롬프트 버튼들 활성화
            const quickBtns = document.querySelectorAll('.quick-prompt-btn');
            quickBtns.forEach(btn => btn.disabled = false);
        }

        function addMessage(content, isUser = false, sender = '') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            
            const messageMeta = document.createElement('div');
            messageMeta.className = 'message-meta';
            messageMeta.innerHTML = `
                <span>${isUser ? '나' : (sender || '🤖 AI')}</span>
                <span>${getCurrentTime()}</span>
            `;
            
            // 마크다운 스타일 텍스트 처리
            const formattedContent = content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
            
            messageDiv.innerHTML = formattedContent;
            messageDiv.appendChild(messageMeta);
            
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            typingIndicator.style.display = 'block';
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        function connectUser() {
            const userIdInput = document.getElementById('userIdInput');
            const userId = userIdInput.value.trim();
            
            if (!userId) {
                addSystemMessage('❌ 사용자 ID를 입력해주세요.');
                return;
            }

            if (userId.length < 3) {
                addSystemMessage('❌ 사용자 ID는 3글자 이상이어야 합니다.');
                return;
            }

            // 사용자 연결
            currentUser = userId;
            isConnected = true;
            saveLastUserId(userId);
            
            // 사용량 확인
            const usage = getUserUsageCount(currentUser);
            
            if (usage >= DAILY_LIMIT) {
                addSystemMessage(`❌ ${currentUser}님은 오늘의 무료 사용량 ${DAILY_LIMIT}회를 모두 사용했습니다. 내일 다시 이용해주세요.`);
                updateUsageDisplay();
                return;
            }
            
            // UI 업데이트
            apiSetup.style.display = 'none';
            chatForm.style.display = 'flex';
            quickPrompts.style.display = 'flex';
            
            updateUsageDisplay();
            enableChat();
            
            addSystemMessage(`✅ ${currentUser}님, 환영합니다! 오늘 ${DAILY_LIMIT - usage}회 사용 가능합니다.`);
            addMessage(`안녕하세요 ${currentUser}님! 저는 AI 어시스턴트입니다. 무엇을 도와드릴까요? 😊`, false);
            
            messageInput.focus();
        }

        function addSystemMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system-message';
            messageDiv.innerHTML = `
                ${message}
                <div class="message-meta">
                    <span>시스템</span>
                    <span>${getCurrentTime()}</span>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        async function sendToAI(userMessage) {
            if (!isConnected || !currentUser) {
                addSystemMessage('❌ 사용자 인증이 필요합니다.');
                return;
            }

            // 사용량 체크
            const currentUsage = getUserUsageCount(currentUser);
            if (currentUsage >= DAILY_LIMIT) {
                addSystemMessage(`❌ ${currentUser}님의 일일 사용량 ${DAILY_LIMIT}회를 초과했습니다.`);
                disableChat();
                updateUsageDisplay();
                return;
            }

            showTyping();
            sendButton.disabled = true;

            // 사용량 증가
            incrementUserUsage(currentUser);
            updateUsageDisplay();

            // 대화 기록에 사용자 메시지 추가
            conversationHistory.push({
                role: 'user',
                content: userMessage
            });

            // 대화 기록이 너무 길면 최근 20개만 유지
            if (conversationHistory.length > 20) {
                conversationHistory = conversationHistory.slice(-20);
            }

            try {
                // 실제 API 호출 대신 시뮬레이션 (데모용)
                // 실제 서비스에서는 서버에서 API 키를 관리하고 호출해야 함
                await simulateAIResponse(userMessage);
                
            } catch (error) {
                hideTyping();
                addSystemMessage('❌ AI 서비스 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
                
                // 오류 발생시 사용량 복구
                userUsage[currentUser].count--;
                saveUserUsage();
                updateUsageDisplay();
            }

            sendButton.disabled = false;
            if (getUserUsageCount(currentUser) < DAILY_LIMIT) {
                enableChat();
            }
            messageInput.focus();
        }

        async function simulateAIResponse(userMessage) {
            // AI 응답 시뮬레이션 (실제 GPT API 대신)
            const responses = [
                `${currentUser}님의 질문 "${userMessage}"에 대해 답변드리겠습니다. 이것은 실제 AI 응답을 시뮬레이션한 것입니다. 실제 서비스에서는 서버에서 OpenAI API를 호출하여 응답을 생성합니다.`,
                `흥미로운 질문이네요, ${currentUser}님! 실제 AI 서비스에서는 이 부분에서 GPT API를 통해 지능적인 응답을 생성할 것입니다.`,
                `${currentUser}님, 좋은 질문입니다! 실제 구현에서는 서버 측에서 OpenAI API를 안전하게 호출하여 더 정확하고 유용한 답변을 제공할 수 있습니다.`,
                `네, ${currentUser}님! 이해했습니다. 실제 AI 서비스에서는 이런 질문에 대해 더 구체적이고 도움이 되는 답변을 드릴 수 있어요.`
            ];

            // 응답 지연 시뮬레이션
            await new Promise(resolve => setTimeout(resolve, 1500 + Math.random() * 2000));
            
            hideTyping();
            
            const aiResponse = responses[Math.floor(Math.random() * responses.length)];
            
            // AI 응답을 대화 기록에 추가
            conversationHistory.push({
                role: 'assistant',
                content: aiResponse
            });
            
            addMessage(aiResponse, false);
        }

        function quickPrompt(prompt) {
            messageInput.value = prompt;
            messageInput.focus();
        }

        function handleSubmit(e) {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;
            
            addMessage(message, true);
            messageInput.value = '';
            
            sendToAI(message);
        }

        // 텍스트 영역 자동 크기 조절
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 이벤트 리스너
        chatForm.addEventListener('submit', handleSubmit);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSubmit(e);
            }
        });

        // 사용자 ID 입력 엔터 처리
        document.getElementById('userIdInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                connectUser();
            }
        });

        // 초기화
        window.addEventListener('load', () => {
            loadUserUsage();
            
            // 저장된 사용자 ID 로드 (선택사항)
            const savedUserId = localStorage.getItem('lastUserId');
            if (savedUserId) {
                document.getElementById('userIdInput').value = savedUserId;
            }
        });

        // 사용자 ID 저장
        function saveLastUserId(userId) {
            localStorage.setItem('lastUserId', userId);
        }
    </script>
