<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시크릿 코드 입력</title>
  <link rel="stylesheet" href="assets/style/secretstyle.css">
</head>
<body>
  <div class="modal-content narrow">
    <h2>시크릿 코드 입력</h2>
    <input type="password" id="secretCodeInput" placeholder="코드 입력">
    <button class="btn primary" onclick="checkSecret()">확인</button>

    <div id="secretContent" style="display:none; margin-top:20px;">
      <h3>🎉 비밀 스테이지에 오신 걸 환영합니다!</h3>
      <p>이곳은 선택받은 자만 들어올 수 있는 공간입니다.</p>
  // 나중에 생각하자...
    </div>
  </div>

  <script>
    async function checkSecret() {
      const code = document.getElementById("secretCodeInput").value;
      const response = await fetch("https://script.google.com/macros/s/AKfycbzXrtDcnrSwrqVOnaiIl6Idj1PckOPMUS63QSP0GxATisbvC_QE_wBZdfoj5lNhFvFl0g/exec", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "checkSecret", code })
      });

      const result = await response.json();
      if (result.success) {
        document.getElementById("secretContent").style.display = "block";
      } else {
        alert(result.msg);
      }
    }
  </script>
</body>
</html>
