<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하드모드</title>
<link rel="stylesheet" href="secret.css">
</head>
<body>
    <h1>하드모드 🔥</h1>
    <p>시크릿 코드를 입력하고 원하는 하드모드를 활성화하세요.</p>

    <input type="text" id="secretInput" placeholder="시크릿 코드">
    <button id="checkBtn">코드 확인</button>
    <p id="status"></p>

    <div id="hardButtons" style="display:none; margin-top:20px;">
        <button id="namulHardBtn">나물 줍기 하드모드</button>
        <button id="jumpHardBtn">점프 게임 하드모드</button>
    </div>

    <script src="secret.js"></script>
    <script src="frontend.js"></script>
<script>
document.getElementById("submitSecret").addEventListener("click", async () => {
  const code = document.getElementById("secretCode").value;
  const token = localStorage.getItem("token");

  const res = await apiRequest("secretCheck", { code, token });
  if (res.success) {
    localStorage.setItem("hardToken", "true");
    alert("하드모드 언락 완료!");
  } else {
    alert("시크릿 코드가 틀렸습니다.");
  }
});
</script>
</body>
</html>
