<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시크릿 코드 입력</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; }
    input { padding: 8px; width: 200px; }
    button { padding: 8px 12px; margin-left: 5px; }
  </style>
</head>
<body>
  <h1>시크릿 코드 입력</h1>
  <input type="text" id="secretCodeInput" placeholder="시크릿 코드">
  <button id="submitSecretBtn">제출</button>

  <script>
    const API_URL = "/api/namul";

    document.getElementById("submitSecretBtn").addEventListener("click", () => {
      const code = document.getElementById("secretCodeInput").value.trim();
      const token = localStorage.getItem("token");

      if (!token) {
        alert("로그인이 필요합니다!");
        return;
      }

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "checkSecret", token, code })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("시크릿 코드 인증 완료!");
          localStorage.setItem("secretUnlock", "TRUE");
          window.location.href = "index.html";
        } else {
          alert("잘못된 시크릿 코드입니다.");
        }
      })
      .catch(err => alert("오류 발생: " + err.message));
    });
  </script>
</body>
</html>
