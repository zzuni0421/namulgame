<!DOCTYPE html>
<html>
<head>
  <title>Secret</title>
</head>
<body>
  <h2>시크릿 코드 입력</h2>
  <input type="password" id="secretCode" placeholder="시크릿 코드">
  <button id="unlockBtn">Unlock</button>
  <p id="status"></p>

  <script type="module">
    import { unlockHard } from "./game/js/frontend.js";

    document.getElementById("unlockBtn").addEventListener("click", async () => {
      const code = document.getElementById("secretCode").value;
      const res = await unlockHard(code);

      if (res.success) {
        localStorage.setItem("hardToken", "true");
        document.getElementById("status").textContent = "하드모드 언락 완료!";
      } else {
        document.getElementById("status").textContent = "시크릿 코드가 틀렸습니다.";
      }
    });
  </script>
</body>
</html>
