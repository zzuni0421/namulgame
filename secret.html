<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>시크릿</title>
</head>
<body>
  <h2>비밀 모드 해제</h2>
  <input id="secret" type="password" placeholder="시크릿 코드 입력" />
  <button id="submit">확인</button>
  <p id="result"></p>

  <script>
    document.getElementById("submit").addEventListener("click", async () => {
      const code = document.getElementById("secret").value;
      const res = await fetch("/api/secret", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem("hardmodeUnlocked", "true");
        document.getElementById("result").textContent = "하드모드 해제 완료!";
      } else {
        document.getElementById("result").textContent = "틀렸습니다.";
      }
    });
  </script>
</body>
</html>
