<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>접속 차단됨 - 나물게임</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f2f2f2;
      font-family: 'Pretendard', sans-serif;
      color: #333;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 30px;
      border: 1px solid #ccc;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      border-radius: 12px;
    }
    .icon {
      font-size: 80px;
      color: #ff4c4c;
    }
    h1 {
      font-size: 28px;
      margin: 20px 0 10px;
    }
    p {
      font-size: 16px;
      margin: 10px 0 20px;
    }
    .btn-home {
      display: inline-block;
      padding: 10px 25px;
      background-color: #4caf50;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn-home:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚫</div>
    <h1>접속 차단됨</h1>
    <p>
      나물게임은 VPN, IDC, 또는 프록시 환경에서는 이용할 수 없습니다.<br>
      안전한 네트워크 환경에서 다시 시도해주세요.
    </p>
  </div>
</body>
</html>
