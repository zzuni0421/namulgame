<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>나물게임 QnA</title>
  <style>
.qna-container {
  max-width: 700px;
  margin: 40px auto;
  padding: 20px;
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
}

.qna-item {
  border-bottom: 1px solid #eee;
  padding: 16px 0;
  transition: all 0.3s ease;
}

.qna-item:last-child {
  border-bottom: none;
}

.qna-question {
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  font-size: 18px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  padding: 8px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.qna-question::after {
  content: "＋";
  font-size: 20px;
  transition: transform 0.3s;
}

.qna-item.active .qna-question::after {
  content: "－";
  transform: rotate(180deg);
  color: #007bff;
}

.qna-answer {
  max-height: 0;
  overflow: hidden;
  font-size: 16px;
  color: #555;
  line-height: 1.6;
  transition: max-height 0.3s ease, padding 0.3s ease;
  padding: 0;
}

.qna-item.active .qna-answer {
  max-height: 300px;
  padding: 12px 0;
  color: #444;
}
</head>
<body>
  <h1>나물게임 QnA</h1>

  <div class="top-controls">
    <div>아이디: <strong id="userDisplay"></strong></div>
    <button onclick="goLobby()">로비로 돌아가기</button>
  </div>

  <div class="qna-form">
    <textarea id="question" rows="3" placeholder="질문을 입력하세요..."></textarea>
    <button onclick="submitQuestion()">질문 등록</button>
  </div>

  <div class="qna-list" id="qnaList">
    <p>불러오는 중...</p>
  </div>

  <script>
    const userId = localStorage.getItem("userId") || "게스트";
    document.getElementById("userDisplay").textContent = userId;

    async function submitQuestion() {
      const question = document.getElementById("question").value.trim();
      if(!question) { alert("질문을 입력하세요!"); return; }
      const res = await fetch("/api/qna", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, question })
      });
      const data = await res.json();
      if(data.success){
        document.getElementById("question").value = "";
        loadQnA();
      } else {
        alert("등록 실패: " + data.error);
      }
    }

    async function loadQnA() {
      const res = await fetch("/api/qna");
      const data = await res.json();
      const list = document.getElementById("qnaList");
      list.innerHTML = "";
      data.reverse().forEach(item => {
        const div = document.createElement("div");
        div.className = "qna-item";
        div.innerHTML = `
          <div class="qna-user">${item.userId}:</div>
          <div class="qna-question">${item.question}</div>
          ${item.answer ? `<div class="qna-answer">↳ ${item.answer}</div>` : ""}
        `;
        list.appendChild(div);
      });
    }

    function goLobby() { window.location.href = "/"; }

    loadQnA();
  </script>
</body>
</html>
